<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cast JHAF</title>

<!-- SDK oficial de Google Cast Application Framework (CAF) para receptores -->
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }

  cast-media-player {
    width: 100%;
    height: 100%;
  }

  /* Pantalla de espera (splash) mientras no hay contenido reproduciéndose */
  #splash {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
    color: #ffffff;
    z-index: 9999;
    transition: opacity 0.6s ease;
  }

  #splash.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .logo {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 20px;
    color: #cccccc;
    letter-spacing: 2px;
  }

  .cast-icon {
    margin-top: 40px;
    width: 90px;
    height: 90px;
    opacity: 0.85;
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 0.6; }
    50%  { transform: scale(1.08); opacity: 1;   }
    100% { transform: scale(1);   opacity: 0.6; }
  }

  .status {
    margin-top: 30px;
    font-size: 14px;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <!-- Reproductor de medios de Google Cast: aquí se renderiza automáticamente
       el video, audio o imagen que llega desde el celular o Chrome -->
  <cast-media-player id="player"></cast-media-player>

  <!-- Pantalla de espera / marca -->
  <div id="splash">
    <div class="logo">CAST JHAF</div>
    <div class="subtitle">Receptor de contenido Google Cast</div>

    <svg class="cast-icon" viewBox="0 0 24 24" fill="#4facfe" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm18-7H5v1.63c3.96 1.28 7.09 4.41 8.37 8.37H19V7zM1 10v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
    </svg>

    <div class="status" id="statusText">Esperando conexión…</div>
  </div>

<script>
  // ============================================================
  //  CAST JHAF – Receptor personalizado de Google Cast
  // ============================================================

  const context = cast.framework.CastReceiverContext.getInstance();
  const playerManager = context.getPlayerManager();
  const splash = document.getElementById('splash');
  const statusText = document.getElementById('statusText');

  // --- Mostrar/ocultar splash según el estado de reproducción ---
  playerManager.addEventListener(
    cast.framework.events.EventType.PLAYER_LOAD_COMPLETE,
    () => {
      splash.classList.add('hidden');
    }
  );

  playerManager.addEventListener(
    cast.framework.events.EventType.MEDIA_STATUS,
    (event) => {
      const state = playerManager.getPlayerState();
      if (state === cast.framework.PlayerState.PLAYING) {
        splash.classList.add('hidden');
        statusText.textContent = 'Reproduciendo';
      } else if (state === cast.framework.PlayerState.PAUSED) {
        statusText.textContent = 'En pausa';
      } else if (state === cast.framework.PlayerState.IDLE) {
        splash.classList.remove('hidden');
        statusText.textContent = 'Esperando conexión…';
      }
    }
  );

  // --- Interceptor de carga: permite loguear o modificar la solicitud
  //     de reproducción antes de que se cargue el contenido enviado
  //     desde el celular o Chrome ---
  playerManager.setMessageInterceptor(
    cast.framework.messages.MessageType.LOAD,
    (loadRequestData) => {
      console.log('Cast JHAF: solicitud de carga recibida', loadRequestData);
      statusText.textContent = 'Cargando contenido…';
      return loadRequestData;
    }
  );

  // --- Evento: sender (celular / Chrome) se conecta ---
  context.addEventListener(
    cast.framework.system.EventType.SENDER_CONNECTED,
    (event) => {
      console.log('Cast JHAF: dispositivo conectado', event.senderId);
      statusText.textContent = 'Dispositivo conectado';
    }
  );

  // --- Evento: sender se desconecta ---
  context.addEventListener(
    cast.framework.system.EventType.SENDER_DISCONNECTED,
    (event) => {
      console.log('Cast JHAF: dispositivo desconectado', event.senderId);
      if (context.getSenders().length === 0) {
        statusText.textContent = 'Esperando conexión…';
      }
    }
  );

  // --- Opciones del receptor ---
  const options = new cast.framework.CastReceiverOptions();
  options.maxInactivity = 3600; // segundos antes de cerrar por inactividad
  options.disableIdleTimeout = false;

  // Habilita el "shaka player" para mejor soporte de formatos (HLS, DASH, etc.)
  options.useShakaForHls = true;

  // --- Iniciar el receptor ---
  context.start(options);

  console.log('Cast JHAF: receptor iniciado correctamente ✅');
</script>

</body>
</html>
