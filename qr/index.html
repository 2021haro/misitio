<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cast JHAF</title>

<!-- Librería oficial de Google Cast Sender -->
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1a2e 0%, #000000 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .logo {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
  }

  .subtitle {
    color: #999;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 30px;
    text-transform: uppercase;
  }

  .card {
    background: #16213e;
    border-radius: 16px;
    padding: 30px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin-bottom: 6px;
    margin-top: 18px;
  }

  input[type="text"], select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #2a2a4a;
    background: #0f0f23;
    color: #fff;
    font-size: 14px;
    outline: none;
  }

  input[type="text"]:focus, select:focus {
    border-color: #4facfe;
  }

  input[type="file"] {
    width: 100%;
    margin-top: 6px;
    color: #ccc;
    font-size: 13px;
  }

  .divider {
    text-align: center;
    color: #555;
    font-size: 12px;
    margin: 18px 0;
    text-transform: uppercase;
  }

  .cast-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 26px;
    gap: 12px;
  }

  google-cast-launcher {
    width: 40px;
    height: 40px;
    --connected-color: #4facfe;
    --disconnected-color: #ffffff;
    cursor: pointer;
  }

  button {
    flex: 1;
    background: linear-gradient(90deg, #4facfe, #00f2fe);
    border: none;
    color: #001;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #status {
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #0f0f23;
    font-size: 13px;
    color: #8fd3ff;
    text-align: center;
    min-height: 18px;
  }

  .controls {
    display: none;
    margin-top: 18px;
    gap: 10px;
    justify-content: center;
  }

  .controls.active { display: flex; }

  .controls button {
    flex: none;
    width: 46px;
    height: 46px;
    padding: 0;
    font-size: 18px;
    border-radius: 50%;
  }

  footer {
    margin-top: 30px;
    color: #555;
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="logo">CAST JHAF</div>
  <div class="subtitle">Emisor de contenido a Google Cast — 100% gratis</div>

  <div class="card">

    <label for="mediaUrl">URL del video, audio o imagen</label>
    <input type="text" id="mediaUrl" placeholder="https://ejemplo.com/video.mp4">

    <div class="divider">— o —</div>

    <label for="fileInput">Selecciona un archivo de tu celular / PC</label>
    <input type="file" id="fileInput" accept="video/*,audio/*,image/*">

    <label for="mediaType">Tipo de contenido</label>
    <select id="mediaType">
      <option value="video/mp4">Video (MP4)</option>
      <option value="video/webm">Video (WebM)</option>
      <option value="audio/mpeg">Audio (MP3)</option>
      <option value="image/jpeg">Imagen (JPG/PNG)</option>
    </select>

    <div class="cast-row">
      <google-cast-launcher id="castButton"></google-cast-launcher>
      <button id="playBtn" disabled>▶ Transmitir a TV</button>
    </div>

    <div class="controls" id="controls">
      <button id="pauseBtn">⏸</button>
      <button id="stopBtn">⏹</button>
      <button id="volUpBtn">🔊</button>
      <button id="volDownBtn">🔉</button>
    </div>

    <div id="status">Esperando conexión con un dispositivo Cast…</div>
  </div>

  <footer>
    Usa el Receptor Multimedia Predeterminado de Google — sin registro, sin costo.
  </footer>

<script>
  // ============================================================
  //  CAST JHAF — Emisor (sender) gratuito de Google Cast
  //  Usa DEFAULT_MEDIA_RECEIVER_APP_ID: no requiere registro ni pago
  // ============================================================

  let castSession = null;
  let localFileUrl = null;

  const statusEl   = document.getElementById('status');
  const playBtn    = document.getElementById('playBtn');
  const urlInput   = document.getElementById('mediaUrl');
  const fileInput  = document.getElementById('fileInput');
  const typeSelect = document.getElementById('mediaType');
  const controls   = document.getElementById('controls');

  function setStatus(text) {
    statusEl.textContent = text;
  }

  // --- Se llama automáticamente cuando la librería de Cast está lista ---
  window['__onGCastApiAvailable'] = function (isAvailable) {
    if (isAvailable) {
      initializeCastApi();
    } else {
      setStatus('Este navegador no soporta Google Cast. Usa Chrome.');
    }
  };

  function initializeCastApi() {
    const context = cast.framework.CastContext.getInstance();

    context.setOptions({
      receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
      autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
    });

    // --- Escucha cambios en el estado de la sesión (conectado/desconectado) ---
    context.addEventListener(
      cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
      (event) => {
        switch (event.sessionState) {
          case cast.framework.SessionState.SESSION_STARTED:
          case cast.framework.SessionState.SESSION_RESUMED:
            castSession = context.getCurrentSession();
            playBtn.disabled = false;
            setStatus('✅ Conectado a: ' + castSession.getCastDevice().friendlyName);
            break;
          case cast.framework.SessionState.SESSION_ENDED:
            castSession = null;
            playBtn.disabled = true;
            controls.classList.remove('active');
            setStatus('Sesión finalizada. Esperando conexión…');
            break;
        }
      }
    );
  }

  // --- Si el usuario selecciona un archivo local, lo convierte en URL utilizable ---
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;

    localFileUrl = URL.createObjectURL(file);
    urlInput.value = '(archivo local seleccionado: ' + file.name + ')';

    // Autodetecta el tipo de contenido
    if (file.type) {
      const opt = [...typeSelect.options].find(o => o.value === file.type);
      if (opt) typeSelect.value = file.type;
    }

    setStatus('Archivo listo: ' + file.name + ' — nota: solo se reproduce en dispositivos de la misma red local mientras esta pestaña esté abierta.');
  });

  // --- Botón: transmitir contenido ---
  playBtn.addEventListener('click', () => {
    if (!castSession) {
      setStatus('Primero conéctate a un dispositivo Cast (icono de la izquierda).');
      return;
    }

    const mediaUrl = localFileUrl || urlInput.value.trim();
    if (!mediaUrl) {
      setStatus('Escribe una URL o selecciona un archivo primero.');
      return;
    }

    const mediaInfo = new chrome.cast.media.MediaInfo(mediaUrl, typeSelect.value);
    mediaInfo.metadata = new chrome.cast.media.GenericMediaMetadata();
    mediaInfo.metadata.title = 'Cast JHAF';

    const request = new chrome.cast.media.LoadRequest(mediaInfo);

    castSession.loadMedia(request).then(
      () => {
        setStatus('▶ Transmitiendo con éxito');
        controls.classList.add('active');
      },
      (errorCode) => {
        setStatus('❌ Error al transmitir: ' + errorCode);
      }
    );
  });

  // --- Controles de reproducción remota ---
  document.getElementById('pauseBtn').addEventListener('click', () => {
    if (!castSession) return;
    const media = castSession.getMediaSession();
    if (media) media.pause(new chrome.cast.media.PauseRequest(), () => setStatus('⏸ Pausado'), (e) => setStatus('Error: ' + e));
  });

  document.getElementById('stopBtn').addEventListener('click', () => {
    if (!castSession) return;
    const media = castSession.getMediaSession();
    if (media) media.stop(new chrome.cast.media.StopRequest(), () => setStatus('⏹ Detenido'), (e) => setStatus('Error: ' + e));
  });

  document.getElementById('volUpBtn').addEventListener('click', () => {
    if (!castSession) return;
    const vol = new chrome.cast.Volume(Math.min(1, (castSession.getVolume() || 0.5) + 0.1));
    castSession.setVolume(vol, () => setStatus('🔊 Volumen +'), (e) => setStatus('Error: ' + e));
  });

  document.getElementById('volDownBtn').addEventListener('click', () => {
    if (!castSession) return;
    const vol = new chrome.cast.Volume(Math.max(0, (castSession.getVolume() || 0.5) - 0.1));
    castSession.setVolume(vol, () => setStatus('🔉 Volumen -'), (e) => setStatus('Error: ' + e));
  });
</script>

</body>
</html>
