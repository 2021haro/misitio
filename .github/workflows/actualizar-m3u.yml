name: Actualizar lista M3U

on:
  schedule:
    - cron: '0 */6 * * *'   # Cada 6 horas
  workflow_dispatch:         # Permite ejecución manual desde la interfaz de GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Necesario para hacer push de vuelta al repositorio

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install yt-dlp

      - name: Ejecutar script
        run: python actualizar_m3u.py

      - name: Hacer commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lista_radio.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar lista M3U $(date +'%Y-%m-%d %H:%M')"
          git push
