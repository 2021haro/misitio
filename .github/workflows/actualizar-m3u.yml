name: Actualizar lista M3U

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar yt-dlp
        run: pip install yt-dlp

      - name: Ejecutar script
        run: python actualizar_m3u.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canales.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar La Caliente $(date +'%Y-%m-%d %H:%M')"
          git push
