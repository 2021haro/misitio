<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pruebas - TMDB + Embed69</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos para ocultar y mostrar el modal suavemente */
        #modal-backdrop { display: none; }
        #modal-backdrop.active { display: flex; }
        
        /* Contenedor del video para mantener la proporción 16:9 */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background-color: black;
            border-radius: 0.5rem;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <!-- Encabezado y Buscador -->
    <header class="bg-gray-800 p-6 shadow-md">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-3xl font-bold text-blue-400 mb-2">Panel de Streaming V2</h1>
            <p class="text-gray-400 text-sm mb-6">Integración TMDB -> Embed69 (Películas y Series)</p>
            
            <form id="search-form" class="flex gap-2 justify-center">
                <input type="text" id="search-input" placeholder="Buscar película o serie..." required
                       class="w-full max-w-md bg-gray-700 text-white px-4 py-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded font-semibold transition">
                    Buscar
                </button>
            </form>
        </div>
    </header>

    <!-- Contenedor de Resultados -->
    <main class="max-w-6xl mx-auto p-6">
        <div id="results-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Los resultados de TMDB aparecerán aquí -->
            <p class="col-span-full text-center text-gray-500 mt-10">Realiza una búsqueda para comenzar.</p>
        </div>
    </main>

    <!-- Modal (Ventana Emergente) -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-90 z-50 items-center justify-center p-4">
        <div class="bg-gray-800 rounded-lg shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col relative">
            
            <!-- Botón Cerrar -->
            <button id="close-modal" class="absolute -top-4 -right-4 bg-red-600 hover:bg-red-700 text-white rounded-full w-10 h-10 flex items-center justify-center font-bold shadow-lg z-50">
                X
            </button>

            <!-- Cabecera del Modal -->
            <div class="p-4 border-b border-gray-700">
                <h2 id="modal-title" class="text-xl font-bold text-blue-300">Título</h2>
                <p id="modal-type-badge" class="text-xs text-gray-400 uppercase tracking-wider mt-1">Tipo</p>
            </div>

            <!-- Cuerpo del Modal (Donde va el Video o la Lista de Episodios) -->
            <div id="modal-body" class="p-4 overflow-y-auto flex-1">
                <!-- El contenido se inyectará dinámicamente aquí -->
            </div>
            
            <!-- Pie del Modal (Para depuración) -->
            <div class="p-3 bg-gray-900 rounded-b-lg border-t border-gray-700 text-xs font-mono text-green-400 break-all" id="debug-url">
                URL generada aparecerá aquí...
            </div>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        // ¡IMPORTANTE! Reemplaza esto con tu API Key de TMDB (es gratis obtener una en themoviedb.org)
        const TMDB_API_KEY = 'TU_API_KEY_AQUI'; 
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        // Elementos del DOM
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const resultsGrid = document.getElementById('results-grid');
        
        // Elementos del Modal
        const modalBackdrop = document.getElementById('modal-backdrop');
        const closeModalBtn = document.getElementById('close-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalTypeBadge = document.getElementById('modal-type-badge');
        const modalBody = document.getElementById('modal-body');
        const debugUrl = document.getElementById('debug-url');

        // Evento: Enviar búsqueda
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            if (TMDB_API_KEY === 'TU_API_KEY_AQUI') {
                alert("Debes poner tu API KEY de TMDB en el código para que funcione la búsqueda.");
                return;
            }

            resultsGrid.innerHTML = '<p class="col-span-full text-center text-blue-400">Buscando...</p>';
            
            try {
                // Buscamos películas y series (multi search)
                const response = await fetch(`${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&language=es-MX&query=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                // Filtramos solo películas y series (quitamos personas)
                const results = data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv');
                renderResults(results);
            } catch (error) {
                resultsGrid.innerHTML = `<p class="col-span-full text-center text-red-500">Error en la búsqueda: ${error.message}</p>`;
            }
        });

        // Función: Dibujar los resultados en la grilla
        function renderResults(results) {
            resultsGrid.innerHTML = '';
            if (results.length === 0) {
                resultsGrid.innerHTML = '<p class="col-span-full text-center text-gray-500">No se encontraron resultados.</p>';
                return;
            }

            results.forEach(item => {
                const title = item.title || item.name;
                const typeLabel = item.media_type === 'movie' ? '🎬 Película' : '📺 Serie';
                const poster = item.poster_path ? `${IMG_BASE_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=Sin+Imagen';

                const card = document.createElement('div');
                card.className = 'bg-gray-800 rounded-lg overflow-hidden shadow-lg cursor-pointer transform hover:scale-105 transition duration-200 border border-transparent hover:border-blue-500';
                card.innerHTML = `
                    <img src="${poster}" alt="${title}" class="w-full h-auto object-cover aspect-[2/3]">
                    <div class="p-3 text-center">
                        <h3 class="font-bold text-sm truncate" title="${title}">${title}</h3>
                        <span class="text-xs text-gray-400">${typeLabel}</span>
                    </div>
                `;
                
                // Al hacer clic en la tarjeta, abrimos el modal
                card.addEventListener('click', () => handleItemClick(item));
                resultsGrid.appendChild(card);
            });
        }

        // Función: Manejar el clic en un resultado
        async function handleItemClick(item) {
            const title = item.title || item.name;
            modalTitle.textContent = title;
            modalTypeBadge.textContent = item.media_type === 'movie' ? 'Película' : 'Serie de TV';
            modalBody.innerHTML = '<p class="text-center">Cargando datos...</p>';
            debugUrl.textContent = 'Obteniendo ID de IMDb...';
            
            // Mostrar Modal
            modalBackdrop.classList.add('active');

            try {
                // Necesitamos hacer una consulta extra para obtener el ID de IMDb (tt...)
                const detailsResponse = await fetch(`${TMDB_BASE_URL}/${item.media_type}/${item.id}?api_key=${TMDB_API_KEY}&append_to_response=external_ids`);
                const details = await detailsResponse.json();
                
                const imdbId = details.external_ids.imdb_id;

                if (!imdbId) {
                    modalBody.innerHTML = '<p class="text-center text-red-400">Esta producción no tiene un ID de IMDb asociado en la base de datos.</p>';
                    return;
                }

                if (item.media_type === 'movie') {
                    // Es Película: Cargamos el iframe directamente
                    loadEmbed69(imdbId);
                } else if (item.media_type === 'tv') {
                    // Es Serie: Mostramos las temporadas y episodios
                    renderSeriesDetails(details, imdbId);
                }

            } catch (error) {
                modalBody.innerHTML = `<p class="text-center text-red-500">Error al cargar detalles: ${error.message}</p>`;
            }
        }

        // Función: Cargar interfaz de Serie (Temporadas y Episodios)
        function renderSeriesDetails(seriesDetails, imdbId) {
            let html = '<div class="space-y-4">';
            
            // Recorremos las temporadas
            seriesDetails.seasons.forEach(season => {
                // Ignoramos la temporada 0 (suelen ser especiales o extras)
                if(season.season_number === 0) return; 

                html += `
                    <div class="bg-gray-700 rounded p-3">
                        <h4 class="font-bold text-lg mb-2">Temporada ${season.season_number} <span class="text-xs font-normal text-gray-400">(${season.episode_count} episodios)</span></h4>
                        <div class="flex flex-wrap gap-2">
                `;
                
                // Generamos los botones para cada episodio
                for (let e = 1; e <= season.episode_count; e++) {
                    html += `<button onclick="loadEmbed69('${imdbId}', ${season.season_number}, ${e})" class="bg-gray-600 hover:bg-blue-600 text-sm px-3 py-1 rounded transition">Ep ${e}</button>`;
                }
                
                html += `</div></div>`;
            });
            
            html += '</div>';
            html += `<p class="mt-4 text-sm text-gray-400 text-center">Selecciona un episodio para cargar el reproductor.</p>`;
            
            modalBody.innerHTML = html;
            debugUrl.textContent = `ID Base de la Serie: ${imdbId}`;
        }

        // Función: Cargar el iframe de Embed69 en el modal
        function loadEmbed69(imdbId, season = null, episode = null) {
            let embedUrl = `https://embed69.org/play.php?id=${imdbId}`;
            
            // Si es serie, agregamos los parámetros &s= y &e=
            if (season !== null && episode !== null) {
                embedUrl += `&s=${season}&e=${episode}`;
                modalTitle.textContent = modalTitle.textContent.split(' - ')[0] + ` - T${season} E${episode}`;
            }

            modalBody.innerHTML = `
                <div class="video-container">
                    <iframe src="${embedUrl}" allowfullscreen frameborder="0" scrolling="no"></iframe>
                </div>
            `;
            debugUrl.textContent = `URL: ${embedUrl}`;
        }

        // Evento: Cerrar Modal
        closeModalBtn.addEventListener('click', () => {
            modalBackdrop.classList.remove('active');
            // Vaciamos el iframe para detener la reproducción de audio/video en segundo plano
            modalBody.innerHTML = ''; 
        });

        // Cerrar modal al hacer clic fuera de él
        modalBackdrop.addEventListener('click', (e) => {
            if (e.target === modalBackdrop) {
                closeModalBtn.click();
            }
        });
    </script>
</body>
</html>
