<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C:\PANEL_ADMIN_GITHUB_</title>
    <style>
        :root {
            --color-verde: #00ff00;
            --color-rojo: #ff0000;
            --color-naranja: #ffaa00;
            --fondo: #050a05;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--fondo);
            color: var(--color-verde);
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin-bottom: 20px; font-size: 1.5rem; text-align: center; }

        .panel-box {
            border: 1px solid var(--color-verde);
            padding: 20px;
            width: 100%;
            max-width: 650px;
            margin-bottom: 20px;
        }

        .contenedor-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--color-verde);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            border: 1px solid var(--color-rojo);
            transition: .4s;
        }

        .slider:before {
            position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px;
            background-color: var(--color-rojo);
            transition: .4s;
        }

        input:checked + .slider { border-color: var(--color-verde); }
        input:checked + .slider:before {
            transform: translateX(30px);
            background-color: var(--color-verde);
        }

        input[type="text"] {
            background: transparent;
            border: 1px solid var(--color-verde);
            color: var(--color-verde);
            padding: 12px;
            width: 100%;
            font-size: 15px;
            font-family: inherit;
            margin-bottom: 12px;
            outline: none;
        }

        input[type="text"]::placeholder { color: var(--color-verde); opacity: 0.5; }

        .btn-custom {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--color-verde);
            color: var(--color-verde);
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .btn-custom:hover {
            background: var(--color-verde);
            color: #000;
            box-shadow: 0 0 10px var(--color-verde);
        }

        .lista-archivos {
            margin-top: 15px;
            max-height: 280px;
            overflow-y: auto;
        }

        .item-archivo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(0, 255, 0, 0.3);
            font-size: 14px;
            gap: 10px;
        }

        .info-item {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .acciones-item {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-accion {
            background: transparent;
            cursor: pointer;
            padding: 4px 8px;
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn-pausa { border: 1px solid var(--color-naranja); color: var(--color-naranja); }
        .btn-pausa:hover { background: var(--color-naranja); color: #000; }
        .btn-borrar { border: 1px solid var(--color-rojo); color: var(--color-rojo); }
        .btn-borrar:hover { background: var(--color-rojo); color: #000; }

        .estado-texto { font-weight: bold; }
        .estado-on { color: var(--color-verde); }
        .estado-off { color: var(--color-rojo); }
    </style>
</head>
<body>

    <h1>C:\ADMIN_GESTION_GITHUB_</h1>

    <div class="panel-box">
        <!-- INTERRUPTOR GENERAL -->
        <div class="contenedor-switch">
            <span>DESCARGAS GENERALES: <span id="lblEstadoSwitch" class="estado-texto estado-off">DESACTIVADAS</span></span>
            <label class="switch">
                <input type="checkbox" id="chkHabilitarDescargas" onchange="cambiarEstadoDescargas(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <!-- REGISTRO DE ARCHIVOS -->
        <p style="margin-bottom: 8px;">NOMBRE DEL ARCHIVO:</p>
        <input type="text" id="nombreCustomInput" placeholder="Ej. Paquete_WXZ_v1.zip">

        <p style="margin-bottom: 8px;">RUTA O LINK DE GITHUB / MEDIAFIRE / DRIVE:</p>
        <input type="text" id="urlArchivoInput" placeholder="Ej. https://github.com/usuario/repo/raw/main/archivo.zip o link de Drive/Mediafire">

        <button class="btn-custom" onclick="guardarRegistroArchivo()">PUBLICAR ENLACE EN LA WEB</button>
        <p id="estadoSubida" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- LISTA DE ARCHIVOS PUBLICADOS -->
    <div class="panel-box">
        <h2 style="font-size: 1rem; margin-bottom: 10px;">ARCHIVOS PUBLICADOS:</h2>
        <div id="contenedorListaAdmin" class="lista-archivos"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKQzpfbj6ep-yvyT0Z7GGVQsYmZivyHNw",
            authDomain: "misitio-2373f.firebaseapp.com",
            databaseURL: "https://misitio-2373f-default-rtdb.firebaseio.com",
            projectId: "misitio-2373f",
            storageBucket: "misitio-2373f.firebasestorage.app",
            messagingSenderId: "692152740198",
            appId: "1:692152740198:web:fdce00729ae74eac4ac0a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. Sincronizar Switch General
        onValue(ref(db, 'descargasHabilitadas'), (snapshot) => {
            const estado = snapshot.val() || false;
            document.getElementById("chkHabilitarDescargas").checked = estado;
            const lbl = document.getElementById("lblEstadoSwitch");
            lbl.textContent = estado ? "ACTIVADAS" : "DESACTIVADAS";
            lbl.className = `estado-texto ${estado ? 'estado-on' : 'estado-off'}`;
        });

        window.cambiarEstadoDescargas = function(nuevoEstado) {
            set(ref(db, 'descargasHabilitadas'), nuevoEstado);
        }

        // 2. Guardar Enlace en Firebase
        window.guardarRegistroArchivo = async function() {
            const nombre = document.getElementById("nombreCustomInput").value.trim();
            const url = document.getElementById("urlArchivoInput").value.trim();
            const estado = document.getElementById("estadoSubida");

            if (nombre === "" || url === "") {
                estado.style.color = "#ff0000";
                estado.textContent = "LLENA AMBOS CAMPOS.";
                return;
            }

            const idUnico = Date.now();

            try {
                await update(ref(db, `listaArchivos/${idUnico}`), {
                    nombre: nombre,
                    url: url,
                    pausado: false
                });

                estado.style.color = "#00ff00";
                estado.textContent = "----- REGISTRO PUBLICADO -----";
                document.getElementById("nombreCustomInput").value = "";
                document.getElementById("urlArchivoInput").value = "";
                setTimeout(() => { estado.textContent = ""; }, 2000);
            } catch(e) {
                estado.style.color = "#ff0000";
                estado.textContent = "ERROR AL GUARDAR EN BASE DE DATOS";
            }
        }

        // 3. Alternar Pausa
        window.alternarPausaArchivo = function(id, estadoActual) {
            update(ref(db, `listaArchivos/${id}`), {
                pausado: !estadoActual
            });
        }

        // 4. Renderizar Lista
        onValue(ref(db, 'listaArchivos'), (snapshot) => {
            const contenedor = document.getElementById("contenedorListaAdmin");
            contenedor.innerHTML = "";
            const data = snapshot.val();

            if (data) {
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    const div = document.createElement("div");
                    div.className = "item-archivo";
                    const estaPausado = item.pausado || false;

                    div.innerHTML = `
                        <div class="info-item">
                            <span>${item.nombre}</span> ${estaPausado ? '<span style="color:#ff0000; font-size:12px;">[PAUSADO]</span>' : ''}
                        </div>
                        <div class="acciones-item">
                            <button class="btn-accion btn-pausa" onclick="alternarPausaArchivo('${id}', ${estaPausado})">
                                ${estaPausado ? '▶ REANUDAR' : '⏸ PAUSAR'}
                            </button>
                            <button class="btn-accion btn-borrar" onclick="eliminarArchivo('${id}')">X</button>
                        </div>
                    `;
                    contenedor.appendChild(div);
                });
            } else {
                contenedor.innerHTML = "<p style='opacity:0.5; text-align:center;'>NO HAY ARCHIVOS PUBLICADOS</p>";
            }
        });

        // 5. Eliminar
        window.eliminarArchivo = async function(id) {
            if(!confirm("¿Eliminar este registro?")) return;
            remove(ref(db, 'listaArchivos/' + id));
        }
    </script>
</body>
</html>
