<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C:\ADMIN_GESTION_</title>
    <style>
        :root {
            --color-verde: #00ff00;
            --color-rojo: #ff0000;
            --color-naranja: #ffaa00;
            --fondo: #050a05;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--fondo);
            color: var(--color-verde);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ESTILOS DEL MODAL DE LOGIN */
        #pantallaLogin {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--fondo);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 15px;
        }

        .box-login {
            border: 1px solid var(--color-verde);
            padding: 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }

        .box-login h2 {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* ESTILOS DEL PANEL DE ADMINISTRACIÓN */
        #contenidoAdmin {
            display: none;
            width: 100%;
            max-width: 850px;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* ENCABEZADO Y BOTÓN CERRAR SESIÓN */
        .encabezado-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 { 
            font-size: clamp(1.2rem, 3vw, 2.2rem); 
            text-align: center;
            letter-spacing: 1px;
            flex: 1;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--color-rojo);
            color: var(--color-rojo);
            padding: 8px 15px;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(0.75rem, 1.2vw, 0.95rem);
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 38px;
        }

        .btn-logout:hover,
        .btn-logout:focus {
            background: var(--color-rojo);
            color: #000;
            box-shadow: 0 0 10px var(--color-rojo);
            outline: 2px solid #ffffff;
        }

        .panel-box {
            border: 1px solid var(--color-verde);
            padding: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .contenedor-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--color-verde);
            flex-wrap: wrap;
            gap: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            border: 1px solid var(--color-rojo);
            transition: .4s;
        }

        .slider:before {
            position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px;
            background-color: var(--color-rojo);
            transition: .4s;
        }

        input:checked + .slider { border-color: var(--color-verde); }
        input:checked + .slider:before {
            transform: translateX(30px);
            background-color: var(--color-verde);
        }

        .switch input:focus + .slider {
            outline: 2px solid #ffffff;
            box-shadow: 0 0 10px var(--color-verde);
        }

        input[type="text"],
        input[type="password"] {
            background: transparent;
            border: 1px solid var(--color-verde);
            color: var(--color-verde);
            padding: 12px;
            width: 100%;
            font-size: clamp(0.85rem, 1.5vw, 1.05rem);
            font-family: inherit;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            box-shadow: 0 0 10px var(--color-verde);
            border-color: #ffffff;
        }

        input::placeholder { color: var(--color-verde); opacity: 0.5; }

        .btn-custom {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--color-verde);
            color: var(--color-verde);
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(0.85rem, 1.5vw, 1.05rem);
            text-align: center;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            min-height: 44px;
        }

        .btn-custom:hover,
        .btn-custom:focus {
            background: var(--color-verde);
            color: #000;
            box-shadow: 0 0 12px var(--color-verde);
            outline: 2px solid #ffffff;
        }

        .lista-archivos {
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
        }

        .item-archivo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 5px;
            border-bottom: 1px dashed rgba(0, 255, 0, 0.3);
            font-size: clamp(0.85rem, 1.5vw, 1.05rem);
            gap: 10px;
        }

        .info-item {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .acciones-item {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-accion {
            background: transparent;
            cursor: pointer;
            padding: 8px 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(0.75rem, 1.2vw, 0.95rem);
            transition: all 0.2s ease;
            min-height: 38px;
        }

        .btn-pausa { border: 1px solid var(--color-naranja); color: var(--color-naranja); }
        .btn-pausa:hover, .btn-pausa:focus { 
            background: var(--color-naranja); 
            color: #000; 
            outline: 2px solid #ffffff;
            box-shadow: 0 0 10px var(--color-naranja);
        }

        .btn-borrar { border: 1px solid var(--color-rojo); color: var(--color-rojo); }
        .btn-borrar:hover, .btn-borrar:focus { 
            background: var(--color-rojo); 
            color: #000; 
            outline: 2px solid #ffffff;
            box-shadow: 0 0 10px var(--color-rojo);
        }

        .estado-texto { font-weight: bold; }
        .estado-on { color: var(--color-verde); }
        .estado-off { color: var(--color-rojo); }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .panel-box { padding: 12px; }

            .encabezado-admin {
                flex-direction: column;
                gap: 12px;
            }

            .btn-logout {
                width: 100%;
            }

            .item-archivo {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .info-item {
                white-space: normal;
                word-break: break-all;
                margin-bottom: 8px;
            }

            .acciones-item {
                justify-content: space-between;
                width: 100%;
            }

            .btn-accion {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="pantallaLogin">
        <div class="box-login">
            <h2>INTRODUCE LA CONTRASEÑA:</h2>
            <input type="password" id="passInputLogin" placeholder="******" tabindex="0">
            <button class="btn-custom" onclick="verificarLogin()" tabindex="0">ENTRAR</button>
            <p id="msgErrorLogin" style="color: var(--color-rojo); font-weight: bold; margin-top: 10px; min-height: 20px;"></p>
        </div>
    </div>

    <!-- CONTENIDO ADMIN -->
    <div id="contenidoAdmin">
        <div class="encabezado-admin">
            <h1>C:\ADMIN_GESTION_</h1>
            <button class="btn-logout" onclick="cerrarSesion()" tabindex="0">[X] CERRAR SESIÓN</button>
        </div>

        <div class="panel-box">
            <!-- INTERRUPTOR GENERAL -->
            <div class="contenedor-switch">
                <span>DESCARGAS GENERALES: <span id="lblEstadoSwitch" class="estado-texto estado-off">DESACTIVADAS</span></span>
                <label class="switch">
                    <input type="checkbox" id="chkHabilitarDescargas" onchange="cambiarEstadoDescargas(this.checked)" tabindex="0">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- REGISTRO DE ARCHIVOS -->
            <p style="margin-bottom: 8px; text-align: left;">NOMBRE DEL ARCHIVO:</p>
            <input type="text" id="nombreCustomInput" placeholder="Ej. Paquete_WXZ_v1.zip" tabindex="0" style="text-align: left;">

            <p style="margin-bottom: 8px; text-align: left;">RUTA O LINK DE GITHUB / MEDIAFIRE / DRIVE:</p>
            <input type="text" id="urlArchivoInput" placeholder="Ej. https://github.com/usuario/repo/releases/download/.../app.apk" tabindex="0" style="text-align: left;">

            <button class="btn-custom" onclick="guardarRegistroArchivo()" tabindex="0">PUBLICAR ENLACE EN LA WEB</button>
            <p id="estadoSubida" style="text-align: center; margin-top: 10px; font-weight: bold; min-height: 20px;"></p>
        </div>

        <!-- LISTA DE ARCHIVOS PUBLICADOS -->
        <div class="panel-box">
            <h2 style="font-size: clamp(0.95rem, 2vw, 1.2rem); margin-bottom: 10px;">ARCHIVOS PUBLICADOS:</h2>
            <div id="contenedorListaAdmin" class="lista-archivos"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKQzpfbj6ep-yvyT0Z7GGVQsYmZivyHNw",
            authDomain: "misitio-2373f.firebaseapp.com",
            databaseURL: "https://misitio-2373f-default-rtdb.firebaseio.com",
            projectId: "misitio-2373f",
            storageBucket: "misitio-2373f.firebasestorage.app",
            messagingSenderId: "692152740198",
            appId: "1:692152740198:web:fdce00729ae74eac4ac0a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Tecla Enter para enviar contraseña
        document.getElementById("passInputLogin").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarLogin();
            }
        });

        // VERIFICACIÓN ÚNICAMENTE CON passMaestra DE FIREBASE
        window.verificarLogin = async function() {
            const passIngresada = document.getElementById("passInputLogin").value.trim();
            const msgError = document.getElementById("msgErrorLogin");

            if (passIngresada === "") {
                msgError.textContent = "INGRESA LA CONTRASEÑA.";
                setTimeout(() => { msgError.textContent = ""; }, 3000);
                return;
            }

            try {
                // Se lee EXCLUSIVAMENTE el nodo passMaestra
                const snapMaestra = await get(ref(db, 'passMaestra'));
                const passMaestraVal = snapMaestra.exists() ? String(snapMaestra.val()) : null;

                if (passIngresada === passMaestraVal) {
                    desbloquearPanel();
                } else {
                    msgError.textContent = "CONTRASEÑA INCORRECTA.";
                    document.getElementById("passInputLogin").value = "";
                    setTimeout(() => { msgError.textContent = ""; }, 3000);
                }
            } catch(e) {
                msgError.textContent = "ERROR DE CONEXIÓN A FIREBASE.";
                setTimeout(() => { msgError.textContent = ""; }, 3000);
            }
        }

        // CERRAR SESIÓN COMPLETO
        window.cerrarSesion = function() {
            sessionStorage.clear();
            localStorage.clear();
            document.getElementById("passInputLogin").value = "";
            document.getElementById("contenidoAdmin").style.display = "none";
            document.getElementById("pantallaLogin").style.display = "flex";
        }

        function desbloquearPanel() {
            document.getElementById("pantallaLogin").style.display = "none";
            document.getElementById("contenidoAdmin").style.display = "flex";
            escucharBaseDeDatos();
        }

        function escucharBaseDeDatos() {
            onValue(ref(db, 'descargasHabilitadas'), (snapshot) => {
                const estado = snapshot.val() || false;
                document.getElementById("chkHabilitarDescargas").checked = estado;
                const lbl = document.getElementById("lblEstadoSwitch");
                lbl.textContent = estado ? "ACTIVADAS" : "DESACTIVADAS";
                lbl.className = `estado-texto ${estado ? 'estado-on' : 'estado-off'}`;
            });

            onValue(ref(db, 'listaArchivos'), (snapshot) => {
                const contenedor = document.getElementById("contenedorListaAdmin");
                contenedor.innerHTML = "";
                const data = snapshot.val();

                if (data) {
                    Object.keys(data).forEach(id => {
                        const item = data[id];
                        const div = document.createElement("div");
                        div.className = "item-archivo";
                        const estaPausado = item.pausado || false;

                        div.innerHTML = `
                            <div class="info-item">
                                <span>${item.nombre}</span> ${estaPausado ? '<span style="color:#ff0000; font-size:12px;">[PAUSADO]</span>' : ''}
                            </div>
                            <div class="acciones-item">
                                <button class="btn-accion btn-pausa" onclick="alternarPausaArchivo('${id}', ${estaPausado})" tabindex="0">
                                    ${estaPausado ? '▶ REANUDAR' : '⏸ PAUSAR'}
                                </button>
                                <button class="btn-accion btn-borrar" onclick="eliminarArchivo('${id}')" tabindex="0">X</button>
                            </div>
                        `;
                        contenedor.appendChild(div);
                    });
                } else {
                    contenedor.innerHTML = "<p style='opacity:0.5; text-align:center;'>NO HAY ARCHIVOS PUBLICADOS</p>";
                }
            });
        }

        window.cambiarEstadoDescargas = function(nuevoEstado) {
            set(ref(db, 'descargasHabilitadas'), nuevoEstado);
        }

        window.guardarRegistroArchivo = async function() {
            const nombre = document.getElementById("nombreCustomInput").value.trim();
            const url = document.getElementById("urlArchivoInput").value.trim();
            const estado = document.getElementById("estadoSubida");

            if (nombre === "" || url === "") {
                estado.style.color = "#ff0000";
                estado.textContent = "LLENA AMBOS CAMPOS.";
                setTimeout(() => { 
                    if (estado.textContent === "LLENA AMBOS CAMPOS.") {
                        estado.textContent = ""; 
                    }
                }, 3000);
                return;
            }

            const idUnico = Date.now();

            try {
                await update(ref(db, `listaArchivos/${idUnico}`), {
                    nombre: nombre,
                    url: url,
                    pausado: false
                });

                estado.style.color = "#00ff00";
                estado.textContent = "----- REGISTRO PUBLICADO -----";
                document.getElementById("nombreCustomInput").value = "";
                document.getElementById("urlArchivoInput").value = "";
                setTimeout(() => { estado.textContent = ""; }, 2000);
            } catch(e) {
                estado.style.color = "#ff0000";
                estado.textContent = "ERROR AL GUARDAR EN BASE DE DATOS";
                setTimeout(() => { estado.textContent = ""; }, 3000);
            }
        }

        window.alternarPausaArchivo = function(id, estadoActual) {
            update(ref(db, `listaArchivos/${id}`), {
                pausado: !estadoActual
            });
        }

        window.eliminarArchivo = async function(id) {
            if(!confirm("¿Eliminar este registro?")) return;
            remove(ref(db, 'listaArchivos/' + id));
        }
    </script>
</body>
</html>
