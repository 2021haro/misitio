<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Cast Nativo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #esperando {
            color: #fff;
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="esperando">Esperando contenido multimedia...</div>
    
    <video id="miVideo" controls autoplay playsinline webkit-playsinline preload="auto"></video>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARzpYU2Z-VhD3IpNJVoy5YcOBqvbdrr-8",
            authDomain: "micastlocal.firebaseapp.com",
            databaseURL: "https://micastlocal-default-rtdb.firebaseio.com",
            projectId: "micastlocal",
            storageBucket: "micastlocal.firebasestorage.app",
            messagingSenderId: "762436108732",
            appId: "1:762436108732:web:c077f98866eefca4e26bb9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const videoElement = document.getElementById('miVideo');
        const mensajeEsperando = document.getElementById('esperando');

        videoElement.style.display = 'none';

        // Escuchar la base de datos en tiempo real
        database.ref('cast-local-web').on('value', (snapshot) => {
            const urlMedia = snapshot.val();

            if (urlMedia && urlMedia.trim() !== "") {
                // Estado de carga inicial
                mensajeEsperando.style.display = 'none';
                videoElement.style.display = 'block';

                // Si es un stream .m3u8, le asignamos el tipo nativo para la TV
                if (urlMedia.includes('.m3u8')) {
                    videoElement.type = 'application/x-mpegURL';
                } else {
                    videoElement.removeAttribute('type'); // Que el navegador decida para MP4/WebM
                }

                // Cambiar ruta y forzar recarga de buffer nativo limpio
                videoElement.src = urlMedia;
                videoElement.load();
                
                // Intentar reproducir automáticamente
                const playPromise = videoElement.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        console.log("Reproducción automática pausada por el navegador, requiere interacción.");
                    });
                }
            } else {
                // Volver al estado de espera si se limpia la pantalla
                videoElement.pause();
                videoElement.src = "";
                videoElement.removeAttribute('type');
                videoElement.style.display = 'none';
                mensajeEsperando.style.display = 'block';
            }
        });
    </script>
</body>
</html>
