<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Cast Nativo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #esperando { color: #fff; font-family: sans-serif; font-size: 1.5rem; text-align: center; }
    </style>
    <!-- Librería para reproducir flujos HLS (.m3u8) en cualquier navegador -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <div id="esperando">Esperando contenido multimedia...</div>
    <video id="miVideo" controls autoplay playsinline webkit-playsinline preload="auto" muted></video>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARzpYU2Z-VhD3IpNJVoy5YcOBqvbdrr-8",
            authDomain: "micastlocal.firebaseapp.com",
            databaseURL: "https://micastlocal-default-rtdb.firebaseio.com",
            projectId: "micastlocal",
            storageBucket: "micastlocal.firebasestorage.app",
            messagingSenderId: "762436108732",
            appId: "1:762436108732:web:c077f98866eefca4e26bb9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const videoElement = document.getElementById('miVideo');
        const mensajeEsperando = document.getElementById('esperando');
        let hlsPlayer = null;

        videoElement.style.display = 'none';

        database.ref('cast-local-web').on('value', (snapshot) => {
            const urlMedia = snapshot.val();

            if (urlMedia && urlMedia.trim() !== "") {
                mensajeEsperando.style.display = 'none';
                videoElement.style.display = 'block';

                // Si ya había un reproductor HLS activo, lo destruimos para cargar el nuevo
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                    hlsPlayer = null;
                }

                videoElement.muted = true; // Forzar inicio en silencio para AutoPlay

                // Si la URL es un flujo HLS (.m3u8)
                if (urlMedia.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        hlsPlayer = new Hls();
                        hlsPlayer.loadSource(urlMedia);
                        hlsPlayer.attachMedia(videoElement);
                        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() {
                            reproducirVideo();
                        });
                    } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                        // Soporte nativo para Safari o reproductores de TV integrados
                        videoElement.src = urlMedia;
                        reproducirVideo();
                    }
                } else {
                    // Video directo (MP4, etc.)
                    videoElement.removeAttribute('type');
                    videoElement.src = urlMedia;
                    reproducirVideo();
                }

            } else {
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                    hlsPlayer = null;
                }
                videoElement.pause();
                videoElement.src = "";
                videoElement.style.display = 'none';
                mensajeEsperando.style.display = 'block';
            }
        });

        function reproducirVideo() {
            videoElement.load();
            videoElement.play().then(() => {
                setTimeout(() => { videoElement.muted = false; }, 200);
            }).catch(error => {
                console.log("Autoplay bloqueado. Reintentando silenciado:", error);
                videoElement.muted = true;
                videoElement.play();
            });
        }
    </script>
</body>
</html>
