<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Cast Universal - Android TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #esperando {
            color: #fff;
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="esperando">Esperando contenido multimedia...</div>
    
    <!-- Retornamos a la etiqueta nativa con atributos clave para Android TV -->
    <video id="miVideo" controls autoplay playsinline webkit-playsinline></video>

    <!-- Scripts de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Mantener hls.js solo como respaldo por si el navegador lo requiere en lugar del sistema -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARzpYU2Z-VhD3IpNJVoy5YcOBqvbdrr-8",
            authDomain: "micastlocal.firebaseapp.com",
            databaseURL: "https://micastlocal-default-rtdb.firebaseio.com",
            projectId: "micastlocal",
            storageBucket: "micastlocal.firebasestorage.app",
            messagingSenderId: "762436108732",
            appId: "1:762436108732:web:c077f98866eefca4e26bb9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const videoElement = document.getElementById('miVideo');
        const mensajeEsperando = document.getElementById('esperando');
        let hlsInstance = null;

        // Ocultar el elemento de video al iniciar hasta que reciba datos
        videoElement.style.display = 'none';

        function limpiarReproductor() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            videoElement.pause();
            videoElement.src = "";
            videoElement.removeAttribute('type');
            videoElement.load();
        }

        database.ref('cast-local-web').on('value', (snapshot) => {
            const urlMedia = snapshot.val();

            if (urlMedia && urlMedia.trim() !== "") {
                limpiarReproductor();

                mensajeEsperando.style.display = 'none';
                videoElement.style.display = 'block';

                if (urlMedia.includes('.m3u8')) {
                    // INTENTO 1: Ver si el navegador nativo de Android TV soporta .m3u8 directamente de forma nativa
                    if (videoElement.canPlayType('application/vnd.apple.mpegurl') || videoElement.canPlayType('application/x-mpegURL')) {
                        videoElement.type = 'application/x-mpegURL';
                        videoElement.src = urlMedia;
                        videoElement.load();
                        videoElement.play().catch(e => console.log("Auto-play TV nativo bloqueado:", e));
                    } 
                    // INTENTO 2: Si el navegador no lo soporta nativo (como Cốc Cốc), forzar la decodificación por software con Hls.js
                    else if (Hls.isSupported()) {
                        hlsInstance = new Hls({
                            // Configuraciones para mejorar la compatibilidad en hardware limitado de TV
                            lowLatencyMode: true,
                            maxBufferSize: 0,
                            maxBufferLength: 5
                        });
                        hlsInstance.loadSource(urlMedia);
                        hlsInstance.attachMedia(videoElement);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            videoElement.play().catch(e => console.log("Auto-play Hls.js bloqueado:", e));
                        });
                    } else {
                        // Forzar asignación directa como último recurso para que el navegador nativo lo intercepte
                        videoElement.src = urlMedia;
                        videoElement.load();
                        videoElement.play().catch(e => console.log("Último recurso bloqueado:", e));
                    }
                } else {
                    // Para MP4 y otros formatos estándar
                    videoElement.src = urlMedia;
                    videoElement.load();
                    videoElement.play().catch(e => console.log("Error en formato estándar:", e));
                }
            } else {
                limpiarReproductor();
                videoElement.style.display = 'none';
                mensajeEsperando.style.display = 'block';
            }
        });
    </script>
</body>
</html>
