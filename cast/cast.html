<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Cast Fluido - Android TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #esperando {
            color: #fff;
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="esperando">Esperando contenido multimedia...</div>
    <video id="miVideo" controls autoplay playsinline webkit-playsinline></video>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARzpYU2Z-VhD3IpNJVoy5YcOBqvbdrr-8",
            authDomain: "micastlocal.firebaseapp.com",
            databaseURL: "https://micastlocal-default-rtdb.firebaseio.com",
            projectId: "micastlocal",
            storageBucket: "micastlocal.firebasestorage.app",
            messagingSenderId: "762436108732",
            appId: "1:762436108732:web:c077f98866eefca4e26bb9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const videoElement = document.getElementById('miVideo');
        const mensajeEsperando = document.getElementById('esperando');
        let hlsInstance = null;

        videoElement.style.display = 'none';

        function limpiarReproductor() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            videoElement.pause();
            videoElement.src = "";
            videoElement.removeAttribute('type');
            videoElement.load();
        }

        database.ref('cast-local-web').on('value', (snapshot) => {
            const urlMedia = snapshot.val();

            if (urlMedia && urlMedia.trim() !== "") {
                limpiarReproductor();

                mensajeEsperando.style.display = 'none';
                videoElement.style.display = 'block';

                if (urlMedia.includes('.m3u8')) {
                    
                    // Configuramos Hls.js con esteroides para Android TV (Evita congelamientos)
                    if (Hls.isSupported()) {
                        hlsInstance = new Hls({
                            maxBufferLength: 15,        // Guarda máximo 15 segundos en memoria para no saturar la RAM de la TV
                            maxMaxBufferLength: 30,     // Límite estricto de búfer
                            maxBufferSize: 30 * 1000 * 1000, // Máximo 30MB de memoria RAM para video
                            appendErrorMaxRetry: 5,     // Si falla un fragmento, reintenta 5 veces antes de trabarse
                            enableWorker: true,         // Activa hilos de procesamiento paralelos en la TV
                            backBufferLength: 10,       // Borra lo que ya viste para liberar RAM al instante
                            liveDurationInfinity: true
                        });

                        hlsInstance.loadSource(urlMedia);
                        hlsInstance.attachMedia(videoElement);
                        
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            videoElement.play().catch(e => console.log("Auto-play bloqueado:", e));
                        });

                        // MANEJO DE ERRORES AUTOMÁTICO: Si el internet fluctúa, el reproductor se repara solo sin trabarse
                        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                            if (data.fatal) {
                                switch (data.type) {
                                    case Hls.ErrorTypes.NETWORK_ERROR:
                                        console.log("Error de red, intentando recuperar...");
                                        hlsInstance.startLoad();
                                        break;
                                    case Hls.ErrorTypes.MEDIA_ERROR:
                                        console.log("Error de desincronización, intentando recuperar...");
                                        hlsInstance.recoverMediaError();
                                        break;
                                    default:
                                        limpiarReproductor();
                                        break;
                                }
                            }
                        });

                    } 
                    // Si el navegador de la TV fuerza el reproductor del sistema
                    else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                        videoElement.type = 'application/x-mpegURL';
                        videoElement.src = urlMedia;
                        videoElement.load();
                        videoElement.play().catch(e => console.log("Error en nativo:", e));
                    }
                } else {
                    // Para MP4 u otros formatos planos
                    videoElement.src = urlMedia;
                    videoElement.load();
                    videoElement.play().catch(e => console.log("Error en formato estándar:", e));
                }
            } else {
                limpiarReproductor();
                videoElement.style.display = 'none';
                mensajeEsperando.style.display = 'block';
            }
        });
    </script>
</body>
</html>
