<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Cast Local</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #esperando {
            color: #fff;
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="esperando">Esperando contenido multimedia...</div>
    <video id="miVideo" controls autoplay style="display: none;"></video>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Tus credenciales reales de Firebase extraídas de tu consola
        const firebaseConfig = {
            apiKey: "AIzaSyDEgq77_Z67332L6eE5Hcl2K1Gv5K1Y8Z0",
            authDomain: "misitio-2373f.firebaseapp.com",
            databaseURL: "https://misitio-2373f-default-rtdb.firebaseio.com",
            projectId: "misitio-2373f",
            storageBucket: "misitio-2373f.appspot.com",
            messagingSenderId: "818567527027",
            appId: "1:818567527027:web:2a8385dafcffbd6198f7e2"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Referencias a los elementos de la página
        const videoElement = document.getElementById('miVideo');
        const mensajeEsperando = document.getElementById('esperando');

        // Escuchar la ruta "stream/url_actual" en tiempo real
        database.ref('stream/url_actual').on('value', (snapshot) => {
            const urlVideo = snapshot.val();

            if (urlVideo && urlVideo.trim() !== "") {
                // Ocultar texto de espera y mostrar el reproductor de video
                mensajeEsperando.style.display = 'none';
                videoElement.style.display = 'block';

                // Asignar la nueva URL y reproducir automáticamente
                videoElement.src = urlVideo;
                videoElement.load();
                
                videoElement.play().catch(error => {
                    console.log("Nota: La reproducción automática puede requerir un clic del usuario debido a las políticas del navegador.", error);
                });
            } else {
                // Si la URL está vacía, pausar el video y volver al estado de espera
                videoElement.pause();
                videoElement.src = "";
                videoElement.style.display = 'none';
                mensajeEsperando.style.display = 'block';
            }
        });
    </script>
</body>
</html>
