<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Cast Universal - Estilo VLC</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        /* Contenedor del reproductor para que ocupe toda la pantalla */
        .video-container {
            width: 100%;
            height: 100%;
            display: none;
        }
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
        #esperando {
            color: #fff;
            font-size: 1.5rem;
            text-align: center;
            position: absolute;
        }
    </style>
</head>
<body>

    <div id="esperando">Esperando contenido multimedia (VLC Listo)...</div>
    
    <div class="video-container" id="playerContainer">
        <video id="vlcPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls autoplay playsinline></video>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Tus credenciales reales de micastlocal
        const firebaseConfig = {
            apiKey: "AIzaSyARzpYU2Z-VhD3IpNJVoy5YcOBqvbdrr-8",
            authDomain: "micastlocal.firebaseapp.com",
            databaseURL: "https://micastlocal-default-rtdb.firebaseio.com",
            projectId: "micastlocal",
            storageBucket: "micastlocal.firebasestorage.app",
            messagingSenderId: "762436108732",
            appId: "1:762436108732:web:c077f98866eefca4e26bb9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const playerContainer = document.getElementById('playerContainer');
        const mensajeEsperando = document.getElementById('esperando');
        
        // Inicializar Video.js de forma global
        const player = videojs('vlcPlayer', {
            fluid: false,
            autoplay: true,
            controls: true,
            preload: 'auto'
        });

        // Detectar automáticamente el tipo de formato/protocolo según la URL
        function getMimeType(url) {
            if (url.includes('.m3u8')) return 'application/x-mpegURL'; // HLS / IPTV
            if (url.includes('.mpd')) return 'application/dash+xml';   // DASH Streaming
            if (url.includes('.mp4')) return 'video/mp4';
            if (url.includes('.webm')) return 'video/webm';
            if (url.includes('.ogg') || url.includes('.ogv')) return 'video/ogg';
            if (url.includes('.mp3')) return 'audio/mp3';
            if (url.includes('.wav')) return 'audio/wav';
            
            // Si no termina en extensión conocida, intentamos que Video.js lo adivine por defecto
            return 'video/mp4'; 
        }

        // Escuchar los cambios en tu Firebase
        database.ref('cast-local-web').on('value', (snapshot) => {
            const urlMedia = snapshot.val();

            if (urlMedia && urlMedia.trim() !== "") {
                // Ocultar pantalla de carga y mostrar reproductor
                mensajeEsperando.style.display = 'none';
                playerContainer.style.display = 'block';

                // Obtener el formato adecuado para el motor de Video.js
                const tipoFormato = getMimeType(urlMedia);

                // Cambiar la fuente dinámicamente y reproducir
                player.src({
                    src: urlMedia,
                    type: tipoFormato
                });
                
                player.ready(function() {
                    player.play().catch(error => {
                        console.log("La reproducción automática requiere interacción manual:", error);
                    });
                });

            } else {
                // Si mandas limpiar desde el control remoto
                player.pause();
                player.src('');
                playerContainer.style.display = 'none';
                mensajeEsperando.style.display = 'block';
            }
        });
    </script>
</body>
</html>
