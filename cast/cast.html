<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Cast Estable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #esperando {
            color: #fff;
            font-family: sans-serif;
            font-size: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="esperando">Esperando contenido multimedia...</div>
    <video id="miVideo" controls autoplay playsinline webkit-playsinline></video>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyARzpYU2Z-VhD3IpNJVoy5YcOBqvbdrr-8",
            authDomain: "micastlocal.firebaseapp.com",
            databaseURL: "https://micastlocal-default-rtdb.firebaseio.com",
            projectId: "micastlocal",
            storageBucket: "micastlocal.firebasestorage.app",
            messagingSenderId: "762436108732",
            appId: "1:762436108732:web:c077f98866eefca4e26bb9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const videoElement = document.getElementById('miVideo');
        const mensajeEsperando = document.getElementById('esperando');
        let hlsInstance = null;

        videoElement.style.display = 'none';

        function limpiarReproductor() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            videoElement.pause();
            videoElement.src = "";
            videoElement.removeAttribute('type');
            videoElement.load();
        }

        database.ref('cast-local-web').on('value', (snapshot) => {
            const urlMedia = snapshot.val();

            if (urlMedia && urlMedia.trim() !== "") {
                limpiarReproductor();

                mensajeEsperando.style.display = 'none';
                videoElement.style.display = 'block';

                if (urlMedia.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        // Configuración equilibrada (No satura RAM ni rompe la PC)
                        hlsInstance = new Hls({
                            maxBufferLength: 20,         // 20 segundos de colchón
                            maxMaxBufferLength: 40,
                            maxBufferSize: 50 * 1000 * 1000, // 50MB máximo
                            lowLatencyMode: false,       // Desactivado para dar más tiempo a cargar páginas pesadas
                            enableWorker: false          // Desactivado porque rompía la compatibilidad en algunas PCs/TVs
                        });

                        hlsInstance.loadSource(urlMedia);
                        hlsInstance.attachMedia(videoElement);
                        
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            videoElement.play().catch(e => console.log("Auto-play bloqueado:", e));
                        });

                        // Recuperación automática estándar
                        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                            if (data.fatal) {
                                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                                    hlsInstance.startLoad();
                                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                                    hlsInstance.recoverMediaError();
                                }
                            }
                        });
                    } 
                    else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                        videoElement.type = 'application/x-mpegURL';
                        videoElement.src = urlMedia;
                        videoElement.load();
                        videoElement.play().catch(e => console.log("Error en nativo:", e));
                    }
                } else {
                    // Para MP4 y cualquier otro formato plano directo
                    videoElement.src = urlMedia;
                    videoElement.load();
                    videoElement.play().catch(e => console.log("Error en formato estándar:", e));
                }
            } else {
                limpiarReproductor();
                videoElement.style.display = 'none';
                mensajeEsperando.style.display = 'block';
            }
        });
    </script>
</body>
</html>
