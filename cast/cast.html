<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Cast Local</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #esperando { color: #fff; font-family: sans-serif; font-size: 1.5rem; text-align: center; }
    </style>
</head>
<body>

    <div id="esperando">Esperando contenido multimedia...</div>
    <video id="miVideo" controls autoplay style="display: none;"></video>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // Tus credenciales reales de micastlocal
        const firebaseConfig = {
            apiKey: "AIzaSyARzpYU2Z-VhD3IpNJVoy5YcOBqvbdrr-8",
            authDomain: "micastlocal.firebaseapp.com",
            databaseURL: "https://micastlocal-default-rtdb.firebaseio.com",
            projectId: "micastlocal",
            storageBucket: "micastlocal.firebasestorage.app",
            messagingSenderId: "762436108732",
            appId: "1:762436108732:web:c077f98866eefca4e26bb9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const videoElement = document.getElementById('miVideo');
        const mensajeEsperando = document.getElementById('esperando');

        // Escuchando el nodo raíz del nuevo proyecto
        database.ref('cast-local-web').on('value', (snapshot) => {
            const urlVideo = snapshot.val();

            if (urlVideo && urlVideo.trim() !== "") {
                mensajeEsperando.style.display = 'none';
                videoElement.style.display = 'block';
                videoElement.src = urlVideo;
                videoElement.load();
                videoElement.play().catch(error => {
                    console.log("Error de auto-reproducción:", error);
                });
            } else {
                videoElement.pause();
                videoElement.style.display = 'none';
                mensajeEsperando.style.display = 'block';
            }
        });
    </script>
</body>
</html>
