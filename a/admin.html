<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C:\PANEL_ADMIN_LINKS_</title>
    <style>
        :root {
            --color-verde: #00ff00;
            --color-rojo: #ff0000;
            --color-naranja: #ffaa00;
            --fondo: #050a05;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--fondo);
            color: var(--color-verde);
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin-bottom: 20px; font-size: 1.5rem; text-align: center; }

        .panel-box {
            border: 1px solid var(--color-verde);
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        /* ESTILO INTERRUPTOR */
        .contenedor-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--color-verde);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            border: 1px solid var(--color-rojo);
            transition: .4s;
        }

        .slider:before {
            position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px;
            background-color: var(--color-rojo);
            transition: .4s;
        }

        input:checked + .slider { border-color: var(--color-verde); }
        input:checked + .slider:before {
            transform: translateX(30px);
            background-color: var(--color-verde);
        }

        /* INPUTS DE TEXTO Y BOTÓN */
        input[type="text"] {
            background: transparent;
            border: 1px solid var(--color-verde);
            color: var(--color-verde);
            padding: 12px;
            width: 100%;
            font-size: 15px;
            font-family: inherit;
            margin-bottom: 12px;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--color-verde);
            opacity: 0.5;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 8px var(--color-verde);
        }

        .contenedor-botones-form {
            display: flex;
            gap: 10px;
        }

        .btn-custom {
            flex: 1;
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--color-verde);
            color: var(--color-verde);
            font-family: inherit;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-custom:hover {
            background: var(--color-verde);
            color: #000;
            box-shadow: 0 0 10px var(--color-verde);
        }

        .btn-cancelar {
            display: none;
            border-color: var(--color-rojo) !important;
            color: var(--color-rojo) !important;
        }

        .btn-cancelar:hover {
            background: var(--color-rojo) !important;
            color: #000 !important;
            box-shadow: 0 0 10px var(--color-rojo) !important;
        }

        .lista-archivos {
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .item-archivo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(0, 255, 0, 0.3);
            font-size: 14px;
            gap: 10px;
        }

        .info-item {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .acciones-item {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-accion {
            background: transparent;
            cursor: pointer;
            padding: 4px 8px;
            font-family: inherit;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .btn-modificar {
            border: 1px solid var(--color-naranja);
            color: var(--color-naranja);
        }

        .btn-modificar:hover {
            background: var(--color-naranja);
            color: #000;
            box-shadow: 0 0 8px var(--color-naranja);
        }

        .btn-borrar {
            border: 1px solid var(--color-rojo);
            color: var(--color-rojo);
        }

        .btn-borrar:hover {
            background: var(--color-rojo);
            color: #000;
            box-shadow: 0 0 8px var(--color-rojo);
        }

        .estado-texto { font-weight: bold; }
        .estado-on { color: var(--color-verde); }
        .estado-off { color: var(--color-rojo); }

        .subtitulo-modo {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
            color: var(--color-naranja);
            display: none;
        }
    </style>
</head>
<body>

    <h1>C:\ADMIN_GESTION_ARCHIVOS_</h1>

    <div class="panel-box">
        <!-- INTERRUPTOR DE HABILITACIÓN -->
        <div class="contenedor-switch">
            <span>DESCARGAS WXZ: <span id="lblEstadoSwitch" class="estado-texto estado-off">DESACTIVADAS</span></span>
            <label class="switch">
                <input type="checkbox" id="chkHabilitarDescargas" onchange="cambiarEstadoDescargas(this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <!-- FORMULARIO DE EDICIÓN Y REGISTRO -->
        <p id="lblModoFormulario" class="subtitulo-modo">[ MODO EDICIÓN DE ENLACE ]</p>

        <p style="margin-bottom: 8px;">NOMBRE DEL ARCHIVO:</p>
        <input type="text" id="nombreArchivoInput" placeholder="Ej. Paquete_WXZ_v1.zip">

        <p style="margin-bottom: 8px;">LINK DE GOOGLE DRIVE / DROPBOX:</p>
        <input type="text" id="urlArchivoInput" placeholder="Ej. https://drive.google.com/file/d/...">

        <div class="contenedor-botones-form">
            <button id="btnGuardarAccion" class="btn-custom" onclick="guardarEnlace()">GUARDAR ENLACE</button>
            <button id="btnCancelarAccion" class="btn-custom btn-cancelar" onclick="resetearFormulario()">CANCELAR EDICIÓN</button>
        </div>
        <p id="estadoGuardado" style="text-align: center; margin-top: 10px; font-weight: bold;"></p>
    </div>

    <!-- LISTA DE ARCHIVOS REGISTRADOS -->
    <div class="panel-box">
        <h2 style="font-size: 1rem; margin-bottom: 10px;">ARCHIVOS EN EL SERVIDOR:</h2>
        <div id="contenedorListaAdmin" class="lista-archivos"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKQzpfbj6ep-yvyT0Z7GGVQsYmZivyHNw",
            authDomain: "misitio-2373f.firebaseapp.com",
            databaseURL: "https://misitio-2373f-default-rtdb.firebaseio.com",
            projectId: "misitio-2373f",
            storageBucket: "misitio-2373f.firebasestorage.app",
            messagingSenderId: "692152740198",
            appId: "1:692152740198:web:fdce00729ae74eac4ac0a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let idEnEdicion = null; // Guardará la id si se está modificando un item

        // 1. Sincronizar estado del Switch
        const switchRef = ref(db, 'descargasHabilitadas');
        onValue(switchRef, (snapshot) => {
            const estado = snapshot.val() || false;
            document.getElementById("chkHabilitarDescargas").checked = estado;
            const lbl = document.getElementById("lblEstadoSwitch");
            lbl.textContent = estado ? "ACTIVADAS" : "DESACTIVADAS";
            lbl.className = `estado-texto ${estado ? 'estado-on' : 'estado-off'}`;
        });

        window.cambiarEstadoDescargas = function(nuevoEstado) {
            set(switchRef, nuevoEstado);
        }

        // 2. Guardar o Actualizar Enlace en Realtime Database
        window.guardarEnlace = function() {
            const nombre = document.getElementById("nombreArchivoInput").value.trim();
            const url = document.getElementById("urlArchivoInput").value.trim();
            const estado = document.getElementById("estadoGuardado");

            if (nombre === "" || url === "") {
                estado.style.color = "#ff0000";
                estado.textContent = "DEBES LLENAR AMBOS CAMPOS.";
                return;
            }

            const esActualizacion = (idEnEdicion !== null);
            const targetID = esActualizacion ? idEnEdicion : Date.now();

            const datosGuardar = {};
            datosGuardar['listaArchivos/' + targetID] = {
                nombre: nombre,
                url: url
            };

            update(ref(db), datosGuardar)
                .then(() => {
                    estado.style.color = "#00ff00";
                    estado.textContent = esActualizacion ? "----- ACTUALIZADO -----" : "----- GUARDADO -----";
                    resetearFormulario();
                    setTimeout(() => { estado.textContent = ""; }, 2000);
                })
                .catch(() => {
                    estado.style.color = "#ff0000";
                    estado.textContent = "ERROR AL GUARDAR EN EL SERVIDOR.";
                });
        }

        // 3. Cargar datos en el formulario para modificar
        window.cargarParaEditar = function(id, nombre, url) {
            idEnEdicion = id;
            document.getElementById("nombreArchivoInput").value = nombre;
            document.getElementById("urlArchivoInput").value = url;

            document.getElementById("lblModoFormulario").style.display = "block";
            document.getElementById("btnGuardarAccion").textContent = "ACTUALIZAR ENLACE";
            document.getElementById("btnCancelarAccion").style.display = "block";
            document.getElementById("nombreArchivoInput").focus();
        }

        // 4. Cancelar / Resetear Formulario
        window.resetearFormulario = function() {
            idEnEdicion = null;
            document.getElementById("nombreArchivoInput").value = "";
            document.getElementById("urlArchivoInput").value = "";

            document.getElementById("lblModoFormulario").style.display = "none";
            document.getElementById("btnGuardarAccion").textContent = "GUARDAR ENLACE";
            document.getElementById("btnCancelarAccion").style.display = "none";
        }

        // 5. Renderizar lista de archivos en pantalla
        const listaRef = ref(db, 'listaArchivos');
        onValue(listaRef, (snapshot) => {
            const contenedor = document.getElementById("contenedorListaAdmin");
            contenedor.innerHTML = "";
            const data = snapshot.val();

            if (data) {
                Object.keys(data).forEach(id => {
                    const item = data[id];
                    const div = document.createElement("div");
                    div.className = "item-archivo";
                    div.innerHTML = `
                        <div class="info-item">
                            <span>${item.nombre}</span>
                        </div>
                        <div class="acciones-item">
                            <button class="btn-accion btn-modificar" onclick="cargarParaEditar('${id}', '${item.nombre.replace(/'/g, "\\'")}', '${item.url.replace(/'/g, "\\'")}')">✎</button>
                            <button class="btn-accion btn-borrar" onclick="eliminarArchivo('${id}')">X</button>
                        </div>
                    `;
                    contenedor.appendChild(div);
                });
            } else {
                contenedor.innerHTML = "<p style='opacity:0.5; text-align:center;'>NO HAY ARCHIVOS REGISTRADOS</p>";
            }
        });

        // 6. Eliminar archivo de la base de datos
        window.eliminarArchivo = function(id) {
            if(!confirm("¿Eliminar este enlace?")) return;
            if (idEnEdicion === id) resetearFormulario();
            remove(ref(db, 'listaArchivos/' + id));
        }
    </script>
</body>
</html>
