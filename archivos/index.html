<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C:\ARCHIVOS_WXZ_</title>
    <style>
        :root {
            --color-verde: #00ff00;
            --color-rojo: #ff0000;
            --fondo: #050a05;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            background-color: var(--fondo);
            color: var(--color-verde);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Título fluido adaptativo desde celular hasta Smart TV */
        h1 { 
            margin-bottom: 20px; 
            font-size: clamp(1.2rem, 3vw, 2.2rem); 
            text-align: center;
            letter-spacing: 1px;
        }

        .contenedor-main {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--color-verde);
            padding: 20px;
        }

        .mensaje-bloqueado {
            display: none;
            border: 1px solid var(--color-rojo);
            color: var(--color-rojo);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
            line-height: 1.5;
            font-size: clamp(0.85rem, 2vw, 1.1rem);
        }

        .tarjeta-archivo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            border: 1px dashed var(--color-verde);
            margin-bottom: 12px;
            gap: 15px;
        }

        .nombre-archivo {
            font-weight: bold;
            word-break: break-all;
            flex: 1;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
        }

        .btn-descargar {
            background: transparent;
            border: 1px solid var(--color-verde);
            color: var(--color-verde);
            padding: 12px 20px;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(0.85rem, 1.5vw, 1.1rem);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px; /* Tamaño táctil recomendado para móviles */
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Efecto de enfoque optimizado para navegación por control remoto en Smart TV */
        .btn-descargar:focus,
        .btn-descargar:hover {
            background: var(--color-verde);
            color: #000;
            box-shadow: 0 0 15px var(--color-verde);
            outline: 2px solid #ffffff;
        }

        .btn-descargar.deshabilitado {
            border-color: #555 !important;
            color: #555 !important;
            cursor: not-allowed;
            box-shadow: none !important;
            outline: none !important;
        }

        .btn-descargar.deshabilitado:focus {
            background: transparent !important;
            border-color: var(--color-rojo) !important;
            color: var(--color-rojo) !important;
            box-shadow: 0 0 10px var(--color-rojo) !important;
        }

        /* RESPONSIVO PARA PANTALLAS PEQUEÑAS (MÓVILES) */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .contenedor-main {
                padding: 12px;
            }

            .tarjeta-archivo {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .btn-descargar {
                width: 100%;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>

    <h1>C:\DESCARGA_DE_ARCHIVOS_WXZ_</h1>

    <div class="contenedor-main">
        <!-- BANNER DE BLOQUEO DE DESCARGAS -->
        <div id="bannerBloqueo" class="mensaje-bloqueado">
            DESCARGAS TEMPORALMENTE DESHABILITADAS POR EL ADMINISTRADOR<br>
            COMUNÍCATE POR WHATSAPP/MESSENGER CON EL ADMINISTRADOR.
        </div>

        <div id="listaDescargas"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKQzpfbj6ep-yvyT0Z7GGVQsYmZivyHNw",
            authDomain: "misitio-2373f.firebaseapp.com",
            databaseURL: "https://misitio-2373f-default-rtdb.firebaseio.com",
            projectId: "misitio-2373f",
            storageBucket: "misitio-2373f.firebasestorage.app",
            messagingSenderId: "692152740198",
            appId: "1:692152740198:web:fdce00729ae74eac4ac0a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let descargasGeneralHabilitadas = false;
        let listaArchivosCache = {};

        function formatearUrlDirecta(url) {
            if (!url) return "#";
            if (url.includes("drive.google.com")) {
                const match = url.match(/\/d\/([^\/]+)/) || url.match(/id=([^&]+)/);
                if (match && match[1]) return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            if (url.includes("dropbox.com")) {
                return url.replace("dl=0", "dl=1").replace("www.dropbox.com", "dl.dropboxusercontent.com");
            }
            if (url.includes("github.com") && url.includes("/blob/")) {
                return url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
            }
            return url;
        }

        // 1. Escuchar el switch general de Firebase
        onValue(ref(db, 'descargasHabilitadas'), (snapshot) => {
            descargasGeneralHabilitadas = snapshot.val() || false;
            document.getElementById("bannerBloqueo").style.display = descargasGeneralHabilitadas ? "none" : "block";
            renderizarLista();
        });

        // 2. Escuchar la lista de archivos de Firebase
        onValue(ref(db, 'listaArchivos'), (snapshot) => {
            listaArchivosCache = snapshot.val() || {};
            renderizarLista();
        });

        function renderizarLista() {
            const contenedor = document.getElementById("listaDescargas");
            contenedor.innerHTML = "";
            const llaves = Object.keys(listaArchivosCache);

            if (llaves.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center; opacity:0.6; padding: 15px;'>NO HAY ARCHIVOS DISPONIBLES.</p>";
                return;
            }

            llaves.forEach(id => {
                const item = listaArchivosCache[id];
                const div = document.createElement("div");
                div.className = "tarjeta-archivo";

                const estaDisponible = descargasGeneralHabilitadas && (!item.pausado);
                const claseBoton = estaDisponible ? "btn-descargar" : "btn-descargar deshabilitado";
                const textoBoton = !descargasGeneralHabilitadas ? "BLOQUEADO" : (item.pausado ? "PAUSADO" : "DESCARGAR");

                div.innerHTML = `
                    <span class="nombre-archivo">${item.nombre}</span>
                    <button onclick="window.ejecutarDescargaSegura('${id}')" class="${claseBoton}" id="btnFile_${id}" tabindex="0">
                        ${textoBoton}
                    </button>
                `;
                contenedor.appendChild(div);
            });
        }

        // 3. Ejecutar descarga o mostrar alerta
        window.ejecutarDescargaSegura = async function(id) {
            const btn = document.getElementById(`btnFile_${id}`);
            
            const snapshotEstado = await get(ref(db, 'descargasHabilitadas'));
            const estadoGeneral = snapshotEstado.val() || false;

            const item = listaArchivosCache[id];

            if (!estadoGeneral || (item && item.pausado)) {
                alert("ACCESO DENEGADO: ESTE ARCHIVO NO ESTÁ DISPONIBLE ACTUALMENTE.\nCOMUNÍCATE POR WHATSAPP/MESSENGER CON EL ADMINISTRADOR.");
                return;
            }

            if (!item || !item.url) return;

            const urlFinal = formatearUrlDirecta(item.url);
            const textoOriginal = btn.textContent;
            btn.textContent = "INICIANDO...";

            const a = document.createElement("a");
            a.href = urlFinal;
            a.rel = "noopener noreferrer";
            a.setAttribute("download", item.nombre);
            a.style.display = "none";
            document.body.appendChild(a);

            a.click();

            setTimeout(() => {
                a.remove();
                btn.textContent = textoOriginal;
            }, 1000);
        }
    </script>
</body>
</html>
