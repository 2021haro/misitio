<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C:\ZONA_DE_DESCARGAS_</title>
    <style>
        :root {
            --color-verde: #00ff00;
            --color-rojo: #ff0000;
            --color-azul: #00e5ff;
            --fondo: #050a05;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--fondo);
            color: var(--color-verde);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor-principal {
            width: 100%; max-width: 850px;
            display: flex; flex-direction: column; align-items: center;
        }

        h1 {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            text-align: center; margin-bottom: 20px; letter-spacing: 1px;
        }

        /* BANNER DE ESTADO */
        .banner-estado {
            border: 1px solid var(--color-azul);
            padding: 15px; width: 100%; text-align: center;
            margin-bottom: 25px; background: rgba(0, 229, 255, 0.05);
            font-size: clamp(0.85rem, 1.5vw, 1.1rem); font-weight: bold;
            color: var(--color-azul); display: none;
        }

        /* CONTENEDOR DE ARCHIVOS */
        .panel-box {
            border: 1px solid var(--color-verde);
            padding: 20px; width: 100%; margin-bottom: 20px;
        }

        .lista-archivos {
            display: flex; flex-direction: column; gap: 15px;
        }

        .item-archivo {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border: 1px dashed rgba(0, 255, 0, 0.4);
            gap: 10px; flex-wrap: wrap; background: rgba(0, 255, 0, 0.02);
        }

        .info-nombre {
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
            word-break: break-all; flex: 1;
        }

        .btn-descargar {
            background: transparent; border: 1px solid var(--color-verde);
            color: var(--color-verde); padding: 10px 20px;
            font-family: inherit; font-weight: bold; font-size: clamp(0.8rem, 1.2vw, 1rem);
            cursor: pointer; text-decoration: none; text-align: center;
            transition: all 0.2s ease; min-height: 40px; display: inline-flex;
            align-items: center; justify-content: center;
        }

        .btn-descargar:hover, .btn-descargar:focus {
            background: var(--color-verde); color: #000;
            box-shadow: 0 0 12px var(--color-verde); outline: 2px solid #ffffff;
        }

        .mensaje-bloqueo {
            text-align: center; padding: 40px;
            border: 1px dashed var(--color-rojo); color: var(--color-rojo);
            font-size: clamp(1rem, 2vw, 1.3rem); font-weight: bold;
            background: rgba(255, 0, 0, 0.03); width: 100%;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .item-archivo { flex-direction: column; align-items: stretch; text-align: center; }
            .btn-descargar { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <h1>C:\ZONA_DE_DESCARGAS_</h1>

        <!-- BANNER DE TIEMPO / ESTADO -->
        <div id="bannerEstado" class="banner-estado"></div>

        <!-- LISTA DE DESCARGAS -->
        <div class="panel-box">
            <div id="contenedorArchivos" class="lista-archivos">
                <p style="text-align: center; opacity: 0.6;">CARGANDO ARCHIVOS...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKQzpfbj6ep-yvyT0Z7GGVQsYmZivyHNw",
            authDomain: "misitio-2373f.firebaseapp.com",
            databaseURL: "https://misitio-2373f-default-rtdb.firebaseio.com",
            projectId: "misitio-2373f",
            storageBucket: "misitio-2373f.firebasestorage.app",
            messagingSenderId: "692152740198",
            appId: "1:692152740198:web:fdce00729ae74eac4ac0a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let timerCuentaRegresivaWeb = null;

        // Escuchar cambios en tiempo real en la Base de Datos
        onValue(ref(db), (snapshot) => {
            const data = snapshot.val() || {};
            const descargasGeneral = data.descargasHabilitadas || false;
            const configTiempo = data.configTiempo || { habilitado: false, timestampFin: 0, congeladoMs: 0 };
            const listaArchivos = data.listaArchivos || {};

            evaluarAccesoYRenderizar(descargasGeneral, configTiempo, listaArchivos);
        });

        function evaluarAccesoYRenderizar(generalHabilitado, configTiempo, archivos) {
            const banner = document.getElementById("bannerEstado");
            const contenedor = document.getElementById("contenedorArchivos");
            
            if (timerCuentaRegresivaWeb) {
                clearInterval(timerCuentaRegresivaWeb);
                timerCuentaRegresivaWeb = null;
            }

            let descargasPermitidas = false;

            // 1. Validar si el acceso general permanente está activo
            if (generalHabilitado) {
                descargasPermitidas = true;
                banner.style.display = "none";
            } 
            // 2. Validar si el acceso por tiempo está activo y vigente
            else if (configTiempo.habilitado && configTiempo.timestampFin > Date.now()) {
                descargasPermitidas = true;
                banner.style.display = "block";
                iniciarRelojWeb(configTiempo.timestampFin);
            } 
            // 3. Si hay tiempo congelado
            else if (configTiempo.habilitado && configTiempo.congeladoMs > 0) {
                descargasPermitidas = false;
                banner.style.display = "block";
                const totalSegs = Math.max(0, Math.floor(configTiempo.congeladoMs / 1000));
                const hrs = Math.floor(totalSegs / 3600);
                const mins = Math.floor((totalSegs % 3600) / 60);
                const segs = totalSegs % 60;
                const formato = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${segs.toString().padStart(2, '0')}`;
                banner.innerHTML = `⏳ DESCARGAS DISPONIBLES POR TIEMPO LIMITADO TERMINA EN: ${formato} <span style="color:var(--color-rojo); font-size:12px;"><br>[EN PAUSA / EDITANDO]</span>`;
            } 
            // 4. Si el tiempo expiró o está apagado
            else {
                descargasPermitidas = false;
                banner.style.display = "none";
                if (configTiempo.habilitado && configTiempo.timestampFin > 0 && configTiempo.timestampFin <= Date.now()) {
                    // Auto-apagar en base de datos si el tiempo llegó a 0
                    update(ref(db, 'configTiempo'), { habilitado: false, timestampFin: 0, congeladoMs: 0 });
                }
            }

            // Filtrar archivos válidos (que no estén pausados)
            const llavesArchivos = Object.keys(archivos).filter(id => !archivos[id].pausado);

            if (!descargasPermitidas || llavesArchivos.length === 0) {
                contenedor.innerHTML = `<div class="mensaje-bloqueo">✖ DESCARGAS DESACTIVADAS O NO DISPONIBLES</div>`;
                return;
            }

            // Renderizar lista de archivos disponibles para descarga
            contenedor.innerHTML = "";
            llavesArchivos.forEach(id => {
                const item = archivos[id];
                const div = document.createElement("div");
                div.className = "item-archivo";
                div.innerHTML = `
                    <span class="info-nombre">${item.nombre}</span>
                    <a href="${item.url}" class="btn-descargar" target="_blank" tabindex="0">DESCARGAR</a>
                `;
                contenedor.appendChild(div);
            });
        }

        function iniciarRelojWeb(timestampFin) {
            const banner = document.getElementById("bannerEstado");

            const actualizarReloj = () => {
                const restante = timestampFin - Date.now();
                if (restante <= 0) {
                    clearInterval(timerCuentaRegresivaWeb);
                    update(ref(db, 'configTiempo'), { habilitado: false, timestampFin: 0, congeladoMs: 0 });
                    return;
                }

                const hrs = Math.floor(restante / (1000 * 60 * 60));
                const mins = Math.floor((restante % (1000 * 60 * 60)) / (1000 * 60));
                const segs = Math.floor((restante % (1000 * 60)) / 1000);

                const formato = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${segs.toString().padStart(2, '0')}`;
                banner.innerHTML = `⏳ DESCARGAS DISPONIBLES POR TIEMPO LIMITADO TERMINA EN: ${formato}`;
            };

            actualizarReloj();
            timerCuentaRegresivaWeb = setInterval(actualizarReloj, 1000);
        }
    </script>
</body>
</html>
