<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C:\DESCARGA_DE_ARCHIVOS_</title>
    <style>
        :root {
            --color-verde: #00ff00;
            --color-rojo: #ff0000;
            --color-naranja: #ffaa00;
            --color-azul: #00e5ff;
            --fondo: #050a05;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--fondo);
            color: var(--color-verde);
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { 
            margin-bottom: 20px; 
            font-size: clamp(1.2rem, 3vw, 2.2rem); 
            text-align: center;
            letter-spacing: 1px;
        }

        .contenedor-main {
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--color-verde);
            padding: 20px;
        }

        .mensaje-bloqueado {
            display: none;
            border: 1px solid var(--color-rojo);
            color: var(--color-rojo);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
            line-height: 1.5;
            font-size: clamp(0.85rem, 2vw, 1.1rem);
        }

        .banner-tiempo {
            display: none;
            border: 1px solid var(--color-azul);
            color: var(--color-azul);
            padding: 10px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: clamp(0.85rem, 1.8vw, 1rem);
        }

        .tarjeta-archivo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            border: 1px dashed var(--color-verde);
            margin-bottom: 12px;
            gap: 15px;
        }

        .columna-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .nombre-archivo {
            font-weight: bold;
            word-break: break-all;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
        }

        .texto-actualizando {
            color: var(--color-naranja);
            font-size: clamp(0.75rem, 1.4vw, 0.9rem);
            font-weight: bold;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        .btn-descargar {
            background: transparent;
            border: 1px solid var(--color-verde);
            color: var(--color-verde);
            padding: 12px 20px;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(0.85rem, 1.5vw, 1.1rem);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-descargar:focus,
        .btn-descargar:hover {
            background: var(--color-verde);
            color: #000;
            box-shadow: 0 0 15px var(--color-verde);
            outline: 2px solid #ffffff;
        }

        .btn-descargar.deshabilitado {
            border-color: #555 !important;
            color: #555 !important;
            cursor: not-allowed;
            box-shadow: none !important;
            outline: none !important;
        }

        .btn-descargar.deshabilitado:focus {
            background: transparent !important;
            border-color: var(--color-rojo) !important;
            color: var(--color-rojo) !important;
            box-shadow: 0 0 10px var(--color-rojo) !important;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .contenedor-main { padding: 12px; }
            .tarjeta-archivo {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .btn-descargar { width: 100%; margin-top: 5px; }
        }
    </style>
</head>
<body>

    <h1>C:\DESCARGA_DE_ARCHIVOS_</h1>

    <div class="contenedor-main">
        <!-- BANNER CUENTA REGRESIVA SI HAY TIEMPO ACTIVO -->
        <div id="bannerTiempoReloj" class="banner-tiempo">
            ⏳ DESCARGAS DISPONIBLES POR TIEMPO LIMITADO TERMINA EN : <span id="lblRelojUsuario">--:--:--</span>
        </div>

        <!-- BANNER DE BLOQUEO DE DESCARGAS -->
        <div id="bannerBloqueo" class="mensaje-bloqueado">
            DESCARGAS TEMPORALMENTE DESHABILITADAS POR EL ADMINISTRADOR<br>
            COMUNÍCATE POR WHATSAPP/MESSENGER CON EL ADMINISTRADOR.
        </div>

        <div id="listaDescargas"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKQzpfbj6ep-yvyT0Z7GGVQsYmZivyHNw",
            authDomain: "misitio-2373f.firebaseapp.com",
            databaseURL: "https://misitio-2373f-default-rtdb.firebaseio.com",
            projectId: "misitio-2373f",
            storageBucket: "misitio-2373f.firebasestorage.app",
            messagingSenderId: "692152740198",
            appId: "1:692152740198:web:fdce00729ae74eac4ac0a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let descargasGeneralHabilitadas = false;
        let configTiempoCache = { habilitado: false, timestampFin: 0, congeladoMs: 0 };
        let listaArchivosCache = {};
        let timerRelojUsuario = null;

        function formatearUrlDirecta(url) {
            if (!url) return "#";
            if (url.includes("drive.google.com")) {
                const match = url.match(/\/d\/([^\/]+)/) || url.match(/id=([^&]+)/);
                if (match && match[1]) return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            if (url.includes("dropbox.com")) {
                return url.replace("dl=0", "dl=1").replace("www.dropbox.com", "dl.dropboxusercontent.com");
            }
            if (url.includes("github.com") && url.includes("/blob/")) {
                return url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
            }
            return url;
        }

        function estaGlobalmentePermitido() {
            if (descargasGeneralHabilitadas) return true;
            if (configTiempoCache.habilitado && (configTiempoCache.timestampFin > Date.now() || configTiempoCache.congeladoMs > 0)) {
                return true;
            }
            return false;
        }

        function evaluarBannersYReloj() {
            const estaPermitido = estaGlobalmentePermitido();
            const bannerBloqueo = document.getElementById("bannerBloqueo");
            const bannerTiempo = document.getElementById("bannerTiempoReloj");

            bannerBloqueo.style.display = estaPermitido ? "none" : "block";

            if (configTiempoCache.habilitado) {
                if (configTiempoCache.congeladoMs > 0) {
                    bannerTiempo.style.display = "block";
                    if (timerRelojUsuario) clearInterval(timerRelojUsuario);
                    
                    const totalSegs = Math.max(0, Math.floor(configTiempoCache.congeladoMs / 1000));
                    const hrs = Math.floor(totalSegs / 3600);
                    const mins = Math.floor((totalSegs % 3600) / 60);
                    const segs = totalSegs % 60;
                    document.getElementById("lblRelojUsuario").textContent = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${segs.toString().padStart(2, '0')} (PAUSADO)`;
                } else if (configTiempoCache.timestampFin > Date.now()) {
                    bannerTiempo.style.display = "block";
                    iniciarRelojCliente(configTiempoCache.timestampFin);
                } else {
                    bannerTiempo.style.display = "none";
                    if (timerRelojUsuario) clearInterval(timerRelojUsuario);
                }
            } else {
                bannerTiempo.style.display = "none";
                if (timerRelojUsuario) clearInterval(timerRelojUsuario);
            }

            renderizarLista();
        }

        function iniciarRelojCliente(timestampFin) {
            if (timerRelojUsuario) clearInterval(timerRelojUsuario);

            const actualizar = () => {
                const restante = timestampFin - Date.now();
                if (restante <= 0) {
                    clearInterval(timerRelojUsuario);
                    evaluarBannersYReloj();
                    return;
                }
                const hrs = Math.floor(restante / (1000 * 60 * 60));
                const mins = Math.floor((restante % (1000 * 60 * 60)) / (1000 * 60));
                const segs = Math.floor((restante % (1000 * 60)) / 1000);

                const formato = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${segs.toString().padStart(2, '0')}`;
                document.getElementById("lblRelojUsuario").textContent = formato;
            };

            actualizar();
            timerRelojUsuario = setInterval(actualizar, 1000);
        }

        onValue(ref(db, 'descargasHabilitadas'), (snapshot) => {
            descargasGeneralHabilitadas = snapshot.val() || false;
            evaluarBannersYReloj();
        });

        onValue(ref(db, 'configTiempo'), (snapshot) => {
            configTiempoCache = snapshot.val() || { habilitado: false, timestampFin: 0, congeladoMs: 0 };
            evaluarBannersYReloj();
        });

        onValue(ref(db, 'listaArchivos'), (snapshot) => {
            listaArchivosCache = snapshot.val() || {};
            renderizarLista();
        });

        function renderizarLista() {
            const contenedor = document.getElementById("listaDescargas");
            contenedor.innerHTML = "";
            const llaves = Object.keys(listaArchivosCache);

            if (llaves.length === 0) {
                contenedor.innerHTML = "<p style='text-align:center; opacity:0.6; padding: 15px;'>NO HAY ARCHIVOS DISPONIBLES.</p>";
                return;
            }

            const globalPermitido = estaGlobalmentePermitido();

            llaves.forEach(id => {
                const item = listaArchivosCache[id];
                const div = document.createElement("div");
                div.className = "tarjeta-archivo";

                const estaEditando = item.editando || false;
                const estaDisponible = globalPermitido && (!item.pausado) && (!estaEditando);
                
                const claseBoton = estaDisponible ? "btn-descargar" : "btn-descargar deshabilitado";
                
                let textoBoton = "DESCARGAR";
                if (!globalPermitido || estaEditando) {
                    textoBoton = "BLOQUEADO";
                } else if (item.pausado) {
                    textoBoton = "PAUSADO";
                }

                const mostrarAvisoEdicion = globalPermitido && estaEditando;

                div.innerHTML = `
                    <div class="columna-info">
                        <span class="nombre-archivo">${item.nombre}</span>
                        ${mostrarAvisoEdicion ? '<span class="texto-actualizando">ACTUALIZANDO ARCHIVO ESPERE UN MOMENTO</span>' : ''}
                    </div>
                    <button onclick="window.ejecutarDescargaSegura('${id}')" class="${claseBoton}" id="btnFile_${id}" tabindex="0">
                        ${textoBoton}
                    </button>
                `;
                contenedor.appendChild(div);
            });
        }

        window.ejecutarDescargaSegura = async function(id) {
            const btn = document.getElementById(`btnFile_${id}`);
            const globalPermitido = estaGlobalmentePermitido();
            const item = listaArchivosCache[id];

            if (!globalPermitido || (item && item.pausado) || (item && item.editando)) {
                alert("ACCESO DENEGADO: ESTE ARCHIVO NO ESTÁ DISPONIBLE ACTUALMENTE.\nCOMUNÍCATE POR WHATSAPP/MESSENGER CON EL ADMINISTRADOR.");
                return;
            }

            if (!item || !item.url) return;

            const urlFinal = formatearUrlDirecta(item.url);
            const textoOriginal = btn.textContent;
            btn.textContent = "INICIANDO...";

            const a = document.createElement("a");
            a.href = urlFinal;
            a.rel = "noopener noreferrer";
            a.setAttribute("download", item.nombre);
            a.style.display = "none";
            document.body.appendChild(a);

            a.click();

            setTimeout(() => {
                a.remove();
                btn.textContent = textoOriginal;
            }, 1000);
        }
    </script>
</body>
</html>
