* {

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #00ff66;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    text-shadow: 0 0 5px #00ff66;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,102,0.05),
        rgba(0,255,102,0.05) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
}

/* 🔥 GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 940px;
    margin-bottom: 20px;
}

/* 🔥 TODOS LOS BOTONES MISMA ALTURA */
.grid a,
.boton-1,
.boton-2,
.boton-espacial {
    height: 40px;              /* 👈 MISMA ALTURA QUE CALENDARIO */
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-weight: bold;
    padding: 0 15px;           /* solo horizontal */
    box-sizing: border-box;
    transition: 0.1s;
}

/* GRID BUTTON */
.grid a {
    width: 160px;
    color: #00ff66;
    border: 1px solid #00ff66;
}

.grid a:hover {
    background: #00ff66;
    color: #000;
}

/* CALENDARIO */
.boton-1 {
    color: #ffff00;
    border: 1px solid #ffff00;
}

.boton-espacial:hover {

/* CONTENEDOR */

    max-width: 940px;
}

.fila-botones {

h1 {
    font-family: "Courier New", Courier, monospace;
    color: #00ff66;
}

h1::after {
    content: "_";
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
}
