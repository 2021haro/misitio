<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Páginas_de_películas_y_series</title>
    
    <style>
        :root {
            --color-fondo: #050a05;
            --color-principal: #00ff00;
            --color-boton-1: #ffff00;
            --color-boton-2: #00FFFF;
        }

        body {
            font-family: monospace;
            background: var(--color-fondo);
            color: var(--color-principal);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        /* Contenedor principal de los botones de abajo */
        .contenedor-especial {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 940px;
        }

        .fila-botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        /* Estilo base de los botones */
        a {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-boton-2);
            border: 1px solid var(--color-boton-2);
            padding: 10px 20px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            min-height: 40px;
            transition: 0.2s;
        }

        /* Clase para forzar el salto de fila */
        .salto-fila {
            width: 100%;
            height: 0;
        }

        /* Estilo para escritorio: si quieres que el btn 4 suba, 
           comenta o borra este bloque. */
        @media (min-width: 769px) {
            .salto-fila { display: none; } /* En PC, el salto desaparece y se alinean */
        }
    </style>
</head>
<body>

    <div class="contenedor-especial">
        <div class="fila-botones">
            <a href="#">Descargar CocCoc<br>Android 8+</a>
            <a href="#">Descargar CocCoc<br>Android 7+</a>
            
            <div class="salto-fila"></div>
            
            <a href="#">btn 4</a>
        </div>
    </div>

</body>
</html>
