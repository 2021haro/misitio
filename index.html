<style>
* {
    font-family: monospace;
}

/* 🔥 FONDO TIPO CRT TERMINAL */
body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: #00ff66;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    box-sizing: border-box;

    /* glow hacker */
    text-shadow: 0 0 5px #00ff66;
    animation: flicker 2s infinite;
    position: relative;
    overflow-x: hidden;
}

/* 🔥 ESCANEO CRT (líneas) */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,255,102,0.05),
        rgba(0,255,102,0.05) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
}

/* 🔥 PARPADEO TERMINAL */
@keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.97; }
}

/* 🔥 H1 TIPO TERMINAL */
h1 {
    font-family: "Courier New", monospace;
    color: #00ff66;
    text-shadow: 0 0 8px #00ff66;
}

h1::after {
    content: "_";
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
}

/* 🔥 GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 940px;
    margin-bottom: 20px;
}

/* BOTONES BASE */
.grid a {
    width: 160px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #00ff66;
    color: #00ff66;
    text-decoration: none;
    transition: 0.1s;
    text-shadow: 0 0 5px #00ff66;
}

/* HOVER TERMINAL */
.grid a:hover {
    background: #00ff66;
    color: #000;
}

/* CONTENEDOR */
.contenedor-especial {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 940px;
}

.fila-botones {

    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}
