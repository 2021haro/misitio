<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Páginas_de_películas_y_series</title>
    
    <style>
        :root {
            --color-fondo: #050a05;
            --color-principal: #00ff00;
            --color-boton-1: #ffff00;
            --color-boton-2: #00FFFF;
        }

        body {
            font-family: monospace;
            background: var(--color-fondo);
            color: var(--color-principal);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 10px 10px;
            box-sizing: border-box;
        }

        h1 { font-size: 1.5rem; margin: 0 0 20px 0; text-align: center; }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 940px; 
            margin-bottom: 20px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-principal);
            text-decoration: none;
            padding: 10px;
            border: 1px solid var(--color-principal);
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            box-sizing: border-box;
            transition: background 0.1s, color 0.1s;
        }

        .grid a { width: 160px; height: 40px; }
        a:hover { background: var(--color-principal); color: var(--color-fondo); }

        .contenedor-especial {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 940px;
        }

        .boton-1 { color: var(--color-boton-1); border-color: var(--color-boton-1); width: auto !important; }
        
        /* Contenedor de botones 2, 3 y 4 */
        .fila-botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        /* Estilo base para botones 2, 3 y 4 */
        .fila-botones a { 
            color: var(--color-boton-2); 
            border-color: var(--color-boton-2);
            padding: 10px 20px;
            text-align: center;
            white-space: normal;
        }
        
        /* FUERZA EL SALTO DE LÍNEA DEL BOTÓN 4 */
        .btn-4-especial {
            flex: 0 0 100% !important; /* Ocupa el 100% de la fila */
            max-width: 300px;         /* Limita el ancho para que no sea gigante */
            margin: 0 auto;           /* Centra el botón */
        }

        /* En pantallas grandes, si quieres que el btn 4 suba, elimina el !important o ajusta aquí */
        /* Si quieres que SIEMPRE esté abajo, mantén la configuración anterior */

        @media (min-width: 769px) {
            .fila-botones a { white-space: nowrap; }
            /* Si prefieres que en PC el btn 4 regrese a la línea de los otros, 
               cambia el flex-basis a auto aquí: */
            .btn-4-especial {
                flex: 0 0 auto !important;
            }
        }
    </style>
</head>
<body>
    <h1>C:\PAGINAS_DE_PELICULAS_Y_SERIES_</h1>
    <div class="grid">
        </div>

    <div class="contenedor-especial">
        <a href="#" class="boton-1">Calendario Del Mundial</a>
        
        <div class="fila-botones">
            <a href="#" class="boton-2">Descargar CocCoc<br>Android 8+</a>
            <a href="#" class="boton-3">Descargar CocCoc<br>Android 7+</a>
            <a href="#" class="btn-4-especial">Descargar Nueva Versión<br>BETA (Próximamente)</a>
        </div>
    </div>
</body>
</html>
