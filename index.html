<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Páginas_de_películas_y_series</title>

    <style>
        :root {
            --color-fondo: #050a05;
            --color-principal: #00ff00;
            --color-boton-1: #ffff00;
            --color-secundario: #00FFFF; /* Unificada para botones cian */
        }

        body {
            font-family: monospace;
            background: var(--color-fondo);
            color: var(--color-principal);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        h1 { font-size: 1.5rem; margin: 0 0 20px 0; text-align: center; }
        h1::after { content: "_"; animation: p 1s infinite; }

        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 940px;
            margin-bottom: 20px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-principal);
            text-decoration: none;
            padding: 10px;
            border: 1px solid var(--color-principal);
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            transition: background 0.1s, color 0.1s;
        }

        .grid a { width: 160px; height: 40px; }
        a:hover { background: var(--color-principal); color: var(--color-fondo); }

        .contenedor-especial {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 940px;
        }

        .boton-1 { color: var(--color-boton-1); border-color: var(--color-boton-1); width: auto !important; padding: 10px 20px; }
        .boton-1:hover { background: var(--color-boton-1); color: var(--color-fondo); }
        
        .fila-botones {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        /* Estilo unificado para botones secundarios (cian) */
        .btn-secundario { 
            color: var(--color-secundario); 
            border-color: var(--color-secundario);
            min-height: 40px;
            padding: 10px 20px;
        }
        
        .btn-secundario:hover { background: var(--color-secundario); color: var(--color-fondo); }

        @keyframes p { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

        @media (max-width: 600px) {
            h1 { font-size: 1rem; }
            .grid a { width: 140px; }
        }
    </style>
</head>
<body>

    <h1>C:\PAGINAS_DE_PELICULAS_Y_SERIES_</h1>

    <div class="grid">
        <a href="http://serieskao.top" target="_blank" rel="noopener noreferrer">SeriesKao</a>
        <a href="https://seriesflixhd.shop" target="_blank" rel="noopener noreferrer">SeriesFlix_HD</a>
    </div>

    <div class="contenedor-especial">
        <a href="https://www.espn.com.mx/futbol/calendario/_/liga/fifa.world" target="_blank" rel="noopener noreferrer" class="boton-1">Calendario Del Mundial</a>
        
        <div class="fila-botones">
            <a href="https://www.mediafire.com/file/5ickvwwax1uqqhq/Co_Co_TV_Browser_133.4.405_Android_8%252B.apk/file" target="_blank" rel="noopener noreferrer" class="btn-secundario">Descargar CocCoc TV Browser<br>Android 8+</a>
            <a href="https://www.mediafire.com/file/er065j46qsaql4q/Co_Co_TV_Browser_119.4.245_Android_7%252B.apk/file" target="_blank" rel="noopener noreferrer" class="btn-secundario">Descargar CocCoc TV Browser<br>Android 7+</a>
        </div>
        
        <a href="https://jahf.vercel.app/x" target="_blank" rel="noopener noreferrer" class="btn-secundario">Descargar Nueva Versión X<br>BETA</a>
    </div>

</body>
</html>
