<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAHF Dashboard</title>

<style>
:root{
    --primary:#2563eb;
    --primary-hover:#1d4ed8;
    --primary-light:#eff6ff;
    --bg:#f5f7fb;
    --card:#fff;
    --border:#e5e7eb;
    --text:#111827;
    --muted:#64748b;
    --success:#16a34a;
    --danger:#dc2626;
}

[data-theme="dark"]{
    --bg:#0b1120;
    --card:#111827;
    --border:#263244;
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary-light:#172554;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:'Samsung Sans','SamsungOne',Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}


/* ================= TOPBAR (RESPONSIVA) ================= */

.topbar{
    position:sticky;
    top:0;
    width:100%;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:12px 20px;
    z-index:100;
    gap:15px;
}

.brand{
    font-size:16px;
    font-weight:bold;
    color:var(--text);
    white-space:nowrap;
}

.hamburger-btn{
    display:none;
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.hamburger-btn svg{
    width:18px;
    height:18px;
    stroke:var(--text);
    stroke-width:2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.nav{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
}

.nav-item{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:8px 12px;
    border-radius:10px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:bold;
    text-align:left;
    white-space:nowrap;
}

.nav-item:hover{
    background:var(--bg);
    color:var(--text);
}

.nav-item:hover svg {
    stroke: var(--text);
}

.nav-item.active{
    background:var(--primary-light);
    color:var(--primary);
}

.nav-item.active svg {
    stroke: var(--primary);
}

.nav-icon{
    font-size:15px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-icon svg {
    width: 16px;
    height: 16px;
    stroke: var(--muted);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.nav-item:hover .nav-icon svg,
.nav-item.active .nav-icon svg {
    stroke: var(--primary);
}

.nav-item .android-icon {
    stroke: var(--muted);
    fill: none;
}

.nav-item:hover .android-icon {
    stroke: var(--text);
    fill: none;
}

.nav-item.active .android-icon {
    stroke: var(--primary);
    fill: none;
}

.topbar-actions{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
    margin-left: auto;
}

.btn-icon{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.btn-icon svg{
    width:16px;
    height:16px;
    stroke:var(--text);
    stroke-width:2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.btn-icon:hover{
    border-color:var(--primary);
    color:var(--primary);
}

.btn-icon:hover svg{
    stroke:var(--primary);
}

.storage{
    padding:6px 10px;
    border:1px solid var(--border);
    border-radius:10px;
    width:160px;
}

.storage-head{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:3px;
}

.progress{
    height:5px;
    background:var(--border);
    border-radius:20px;
    overflow:hidden;
}

.progress div{
    width:68%;
    height:100%;
    background:var(--primary);
}

.storage small{
    display:none;
}


/* ================= MENÚ HAMBURGUESA (DRAWER) ================= */

.drawer-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.55);
    backdrop-filter:blur(2px);
    z-index:290;
    display:none;
}

.drawer-overlay.show{
    display:block;
}

.drawer{
    position:fixed;
    top:0;
    left:0;
    height:100vh;
    height:100dvh;
    width:280px;
    max-width:82vw;
    background:var(--card);
    border-right:1px solid var(--border);
    z-index:300;
    transform:translateX(-100%);
    transition:transform .25s ease;
    display:flex;
    flex-direction:column;
    padding:18px;
    padding-bottom:max(18px, env(safe-area-inset-bottom));
    gap:20px;
    overflow-y:auto;
}

.drawer.open{
    transform:translateX(0);
}

.drawer-header{
    display:flex;
    align-items:center;
    gap:12px;
}

.close-btn{
    width:36px;
    height:36px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--card);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.close-btn svg{
    width:16px;
    height:16px;
    stroke:var(--text);
    stroke-width:2;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.drawer-nav{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.drawer-nav .nav-item{
    width:100%;
    justify-content:flex-start;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
}

.drawer-footer{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
}

.drawer-footer .storage{
    width:100%;
}

/* Por defecto (PC/TV) el drawer nunca se muestra */
.drawer,
.drawer-overlay{
    display:none;
}


/* ================= MAIN ================= */

.main{
    min-height:calc(100vh - 70px);
}

.header{
    display:none;
}

.floating-menu-btn{
    display:none;
}

.content{
    padding:28px;
    max-width:1900px;
    margin:auto;
}


/* ================= ESTADISTICAS ================= */

.stats{
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 0;
    margin-left: 20px;
    margin-right: auto;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    width: auto;
    flex: 0 0 auto;
}

.stat-icon{
    width: 32px;
    height: 32px;
    background:var(--primary-light);
    color:var(--primary);
    border-radius: 8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.stat-icon svg {
    width: 16px;
    height: 16px;
    stroke: var(--primary);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.stat-icon svg.android-icon {
    fill: none;
    stroke: var(--primary);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.stat-label{
    display:block;
    color:var(--muted);
    font-size: 10px;
    margin-bottom: 1px;
}

.stat-number{
    font-size: 16px;
    line-height: 1.1;
}


/* ================= TITULO ================= */

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    margin-bottom:18px;
    flex-wrap: wrap;
}

.section-title {
    flex-shrink: 0;
}

.section-title h2{
    font-size:20px;
}

.section-title p{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

.actions{
    display:flex;
    gap:8px;
    flex-shrink: 0;
}

.btn{
    min-height:42px;
    padding:0 15px;
    border-radius:10px;
    border:0;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 2.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-hover);
}

.btn-secondary{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
}

.btn-secondary svg {
    stroke: var(--text);
}


/* ================= TABLA ================= */

.grid-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
}

.toolbar{
    padding:14px;
    border-bottom:1px solid var(--border);
    display:flex;
    gap:10px;
}

.search{
    flex:1;
    position:relative;
}

.search span{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    display: flex;
    align-items: center;
}

.search span svg {
    width: 16px;
    height: 16px;
    stroke: var(--muted);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.search input{
    width:100%;
    height:42px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    padding:0 12px 0 37px;
    outline:none;
    font-size:12px;
}

.filter{
    height:42px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
    border-radius:10px;
    padding:0 12px;
    font-size:12px;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th{
    background:var(--bg);
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    padding:14px 17px;
    text-align:left;
}

td{
    padding:14px 17px;
    border-top:1px solid var(--border);
    font-size:12px;
}

tbody tr:hover{
    background:var(--bg);
}

.file{
    display:flex;
    align-items:center;
    gap:10px;
}

.file-icon{
    width:36px;
    height:36px;
    border-radius:9px;
    background:var(--primary-light);
    display:flex;
    align-items:center;
    justify-content:center;
}

.file-icon svg {
    width: 18px;
    height: 18px;
    stroke: var(--primary);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.file-icon svg.android-icon {
    fill: none;
    stroke: var(--primary);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.file-info strong{
    display:block;
}

.file-info small{
    display:block;
    color:var(--muted);
    margin-top:3px;
    font-size:12px;
}

.badge{
    display:inline-flex;
    padding:5px 9px;
    border-radius:50px;
    font-size:12px;
    font-weight:bold;
}

.badge-pc{
    background:var(--primary-light);
    color:var(--primary);
}

.badge-android{
    background:rgba(22,163,74,.1);
    color:#16a34a;
}

.badge-page{
    background:rgba(8,145,178,.1);
    color:#0891b2;
}

.badge-active{
    background:rgba(22,163,74,.1);
    color:var(--success);
}

.badge-inactive{
    background:rgba(217,119,6,.1);
    color:#d97706;
}

.row-actions{
    display:flex;
    gap:6px;
}

.icon-btn{
    width:32px;
    height:32px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.icon-btn svg {
    width: 14px;
    height: 14px;
    stroke: var(--text);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon-btn:hover{
    border-color:var(--primary);
    color:var(--primary);
}

.icon-btn:hover svg {
    stroke: var(--primary);
}

.note-button{
    border:0;
    background:none;
    color:var(--primary);
    font-size:12px;
    font-weight:bold;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.note-button svg {
    width: 13px;
    height: 13px;
    stroke: var(--primary);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.url{
    color:var(--primary);
    text-decoration:none;
    max-width:300px;
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:12px;
}


/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.6);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:1000;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:550px;
    max-height:90vh;
    overflow-y:auto;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
}

.modal-box-lg{
    max-width:550px;
}

@media(min-width: 1101px){
    .modal-box-lg{
        max-width:680px;
    }
}

.modal-header{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h3{
    font-size:16px;
}

.close{
    border:0;
    background:none;
    color:var(--muted);
    font-size:24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.close svg {
    width: 18px;
    height: 18px;
    stroke: var(--muted);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.close:hover svg {
    stroke: var(--text);
}

.modal-body{
    padding:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:7px;
}

.form-control{
    width:100%;
    min-height:43px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--bg);
    color:var(--text);
    padding:10px 12px;
    outline:none;
    font-size:12px;
}

.form-control:focus{
    border-color:var(--primary);
}

textarea.form-control{
    min-height:90px;
    resize:vertical;
}


/* ================= DROPZONE COMPACTA ================= */

.dropzone{
    border:2px dashed #dbe2ec;
    border-radius:13px;
    padding:10px 15px;
    min-height:70px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    transition:.2s;
    background:var(--card);
}

.dropzone:hover{
    border-color:var(--primary);
    background:var(--primary-light);
}

.dropzone.dragover{
    border-color:var(--primary);
    background:var(--primary-light);
}

.dropzone-icon{
    font-size:20px;
    line-height:1;
    margin-bottom:4px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.dropzone-icon svg {
    width: 20px;
    height: 20px;
    stroke: var(--primary);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.dropzone strong{
    display:block;
    font-size:12px;
    line-height:1.3;
}

.dropzone p{
    margin-top:4px;
    color:var(--primary);
    font-size:12px;
    line-height:1.3;
}

.selected-files{
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.current-file{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    margin-bottom:14px;
    color:var(--muted);
    font-size:12px;
}

.current-file strong{
    display:block;
    color:var(--text);
    margin-bottom:3px;
}


/* ================= CONFIGURACIÓN ================= */

.config-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap:14px;
}

@media(min-width: 1101px){
    .config-grid{
        grid-template-columns: 1fr 1fr;
    }
}

.config-item{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    gap:10px;
}

.config-item-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.config-item-head label.config-label{
    font-size:12px;
    font-weight:bold;
    color:var(--primary);
}

.config-password-box{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    gap:10px;
}

.config-password-box strong{
    font-size:13px;
    color:var(--text);
}

.btn-block{
    width:100%;
    justify-content:center;
}

.modal-footer.split{
    justify-content:space-between;
}

.switch{
    position:relative;
    display:inline-block;
    width:40px;
    height:22px;
    flex-shrink:0;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.switch-slider{
    position:absolute;
    cursor:pointer;
    inset:0;
    background:var(--border);
    border-radius:999px;
    transition:.2s;
}

.switch-slider:before{
    content:"";
    position:absolute;
    height:16px;
    width:16px;
    left:3px;
    top:3px;
    background:#fff;
    border-radius:50%;
    transition:.2s;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
}

.switch input:checked + .switch-slider{
    background:var(--primary);
}

.switch input:checked + .switch-slider:before{
    transform:translateX(18px);
}


/* ================= FOOTER MODAL ================= */

.modal-footer{
    padding:14px 20px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:8px;
}


/* ================= TOAST ================= */

.toast-container{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:2000;
}

.toast{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    padding:13px 16px;
    border-radius:10px;
    margin-top:8px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    font-size:12px;
}


/* ================= RESPONSIVO ================= */

@media(min-width: 1400px){
    .content{
        padding:40px 60px;
    }
}

/* ===== MÓVIL Y TABLET (hasta 1100px): menú hamburguesa ===== */
@media(max-width: 1100px){
    .topbar{
        display:grid;
        grid-template-columns: 44px 1fr 44px;
        align-items:center;
        gap:10px;
        padding:12px 16px;
    }
    .hamburger-btn{
        display:flex;
        grid-column:1;
    }
    .brand{
        grid-column:2;
        text-align:center;
    }
    .nav{
        display:none;
    }
    .topbar-actions{
        grid-column:3;
        margin-left:0;
        justify-content:flex-end;
    }
    .topbar-actions .settings-btn,
    .topbar-actions .fullscreen-btn,
    .topbar-actions .storage{
        display:none;
    }
    .drawer,
    .drawer-overlay{
        display:none;
    }
    .drawer-overlay.show{
        display:block;
    }
    .drawer.open{
        display:flex;
    }
}

/* ===== PC Y TV (desde 1101px): barra horizontal completa ===== */
@media(min-width: 1101px){
    .hamburger-btn{
        display:none;
    }
    .nav{
        display:flex;
    }
    .drawer,
    .drawer-overlay{
        display:none !important;
    }
}

/* TABLET - max 1100px */
@media(max-width: 1100px) and (min-width: 801px){
    .section-header.dashboard-section{
        flex-wrap: wrap;
        justify-content: flex-start !important;
    }
    .section-header.dashboard-section .section-title{
        text-align: left;
        width: auto;
        flex: 0 1 auto;
        order: 1;
    }
    .section-header.dashboard-section .stats{
        margin-left: 0 !important;
        margin-right: 0 !important;

function renderTable() {  
    const body = document.getElementById("tableBody");  
    const header = document.getElementById("tableHeader");  
    const search = document.getElementById("searchInput").value.toLowerCase();  
    const status = document.getElementById("statusFilter").value;  
 
    let data = getVisibleItems().filter(item => {  
        const found = item.name.toLowerCase().includes(search) ||  
                      (item.url || "").toLowerCase().includes(search) ||  
                      (item.note || "").toLowerCase().includes(search);  
        const statusOk = (status === "all" || item.status === status);  
        return found && statusOk;  
    });  
 
    if (currentSection === "pages") {  
        header.innerHTML = `<th>Nombre</th><th>Plataforma</th><th>URL</th><th>Fecha</th><th>Estado</th><th>Acciones</th>`;  
    } else {  
        header.innerHTML = `<th>Nombre</th><th>Plataforma</th><th>Tamaño</th><th>Fecha</th><th>Nota</th><th>Estado</th><th>Acciones</th>`;  
    }  
 
    if (!data.length) {  
        body.innerHTML = `  
            <tr>  
                <td colspan="${currentSection === "pages" ? 6 : 7}">  
                    <div style="text-align:center; padding:50px; color:var(--muted);">  
                        <svg style="width:32px;height:32px;stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px;" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg><br>  
                        No se encontraron registros.  
                    </div>  
                </td>  
            </tr>  
        `;  
        return;  
    }  
 
    body.innerHTML = data.map(createRow).join("");  
}

function openFileModal(type, id = null) {  
    uploadType = type;  
    editingId = id;  
    selectedFile = null;  
    document.getElementById("fileInput").value = "";  
    document.getElementById("selectedFiles").innerHTML = "";  
 
    if (id) {  
        const item = items.find(x => x.id === id);  
        document.getElementById("fileModalTitle").textContent = (type === "android") ? "Editar App Android" : "Editar App PC";  
        document.getElementById("fileName").value = item.name;  
        document.getElementById("fileNote").value = item.note || "";  
        document.getElementById("currentFileBox").style.display = "block";  
        document.getElementById("currentFileBox").innerHTML = `<strong>Archivo actual</strong>${escapeHTML(item.originalName || item.name)}<br>${item.size || ""}`;  
        document.getElementById("saveFileButton").textContent = "Guardar cambios";  
    } else {  
        document.getElementById("fileModalTitle").textContent = (type === "android") ? "Subir App Android" : "Subir App PC";  
        document.getElementById("fileName").value = "";  
        document.getElementById("fileNote").value = "";  
        document.getElementById("currentFileBox").style.display = "none";  
        document.getElementById("saveFileButton").textContent = "Subir Archivo";  
    }  
    document.getElementById("fileModal").classList.add("show");  
}  
 
const fileInput = document.getElementById("fileInput");  
const dropzone = document.getElementById("dropzone");  
 
dropzone.onclick = () => fileInput.click();  
fileInput.onchange = () => { selectedFile = fileInput.files[0] || null; showSelectedFile(); };  
dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add("dragover"); };  
dropzone.ondragleave = () => dropzone.classList.remove("dragover");  
dropzone.ondrop = e => {  
    e.preventDefault();  
    dropzone.classList.remove("dragover");  
    selectedFile = e.dataTransfer.files[0] || null;  
    showSelectedFile();  
};  
 
function showSelectedFile() {  
    if (!selectedFile) {  
        document.getElementById("selectedFiles").innerHTML = "";  
        return;  
    }  
    document.getElementById("selectedFiles").innerHTML = `📄 ${escapeHTML(selectedFile.name)} — ${formatBytes(selectedFile.size)}`;  
}  
 
function saveFile() {  
    const name = document.getElementById("fileName").value.trim();  
    const note = document.getElementById("fileNote").value.trim();  
 
    if (!name) { toast("Escribe un nombre para el archivo."); return; }  
 
    if (editingId) {  
        const item = items.find(x => x.id === editingId);  
        item.name = name;  
        item.note = note;  
        if (selectedFile) {  
            if (uploadType === "android" && !selectedFile.name.toLowerCase().endsWith(".apk")) {  
                toast("Para Android debes seleccionar un archivo APK.");  
                return;  
            }  
            item.originalName = selectedFile.name;  
            item.size = formatBytes(selectedFile.size);  
        }  
        saveData();  
        updateStats();  
        renderTable();  
        closeModal("fileModal");  
        toast("Archivo actualizado correctamente.");  
        return;  
    }  
 
    if (!selectedFile) { toast("Selecciona un archivo."); return; }  
    if (uploadType === "android" && !selectedFile.name.toLowerCase().endsWith(".apk")) {  
        toast("Para Android debes seleccionar un archivo APK.");  
        return;  
    }  
 
    items.unshift({  
        id: Date.now(),  
        name: name,  
        originalName: selectedFile.name,  
        type: uploadType,  
        size: formatBytes(selectedFile.size),  
        date: getToday(),  
        status: "active",  
        note: note  
    });  
 
    saveData();  
    updateStats();  
    renderTable();  
    closeModal("fileModal");  
    toast("Archivo agregado correctamente.");  
}  
 
function openPageModal(id = null) {  
    editingId = id;  
    if (id) {  
        const item = items.find(x => x.id === id);  
        document.getElementById("pageModalTitle").textContent = "Editar página";  
        document.getElementById("siteName").value = item.name;  
        document.getElementById("siteUrl").value = item.url;  
    } else {  
        document.getElementById("pageModalTitle").textContent = "Agregar página";  
        document.getElementById("siteName").value = "";  
        document.getElementById("siteUrl").value = "";  
    }  
    document.getElementById("pageModal").classList.add("show");  
}  
 
function savePage() {  
    const name = document.getElementById("siteName").value.trim();  
    const url = document.getElementById("siteUrl").value.trim();  
 
    if (!name) { toast("Escribe el nombre del sitio."); return; }  
    if (!url) { toast("Escribe la URL."); return; }  
 
    try {  
        const test = new URL(url);  
        if (test.protocol !== "http:" && test.protocol !== "https:") throw new Error();  
    } catch {  
        toast("Introduce una URL válida.");  
        return;  
    }  
 
    if (editingId) {  
        const item = items.find(x => x.id === editingId);  
        item.name = name;  
        item.url = url;  
        saveData();  
        updateStats();  
        renderTable();  
        closeModal("pageModal");  
        toast("Página actualizada correctamente.");  
        return;  
    }  
 
    items.unshift({  
        id: Date.now(),  
        name: name,  
        type: "page",  
        date: getToday(),  
        status: "active",  
        url: url  
    });  
 
    saveData();  
    updateStats();  
    renderTable();  
    closeModal("pageModal");  
    toast("Página agregada correctamente.");  
}  
 
function editItem(id) {  
    const item = items.find(x => x.id === id);  
    if (item.type === "page") openPageModal(id);  
    else openFileModal(item.type, id);  
}  
 
function downloadItem(id) {  
    const item = items.find(x => x.id === id);  
    if (item) {  
        toast(`Iniciando descarga de "${item.name}"...`);  
        const dummyContent = `Simulación del contenido de descarga para: ${item.name} (${item.originalName || item.name})`;  
        const blob = new Blob([dummyContent], { type: 'application/octet-stream' });  
        const url = URL.createObjectURL(blob);  
        const a = document.createElement('a');  
        a.href = url;  
        a.download = item.originalName || `${item.name}.${item.type === 'android' ? 'apk' : 'exe'}`;  
        document.body.appendChild(a);  
        a.click();  
        document.body.removeChild(a);  
        URL.revokeObjectURL(url);  
    }  
}  
 
function showNote(id) {  
    const item = items.find(x => x.id === id);  
    document.getElementById("noteContent").textContent = item.note || "Este archivo no tiene ninguna nota.";  
    document.getElementById("noteModal").classList.add("show");  
}  
 
function toggleStatus(id) {  
    const item = items.find(x => x.id === id);  
    item.status = (item.status === "active") ? "inactive" : "active";  
    saveData();  
    renderTable();  
    toast("Estado actualizado.");  
}  
 
function deleteItem(id) {  
    const item = items.find(x => x.id === id);   
    if (!item) return;  
    if (!confirm(`¿Eliminar "${item.name}"?`)) return;  
    items = items.filter(x => x.id !== id);  
    saveData();  
    updateStats();  
    renderTable();  
    toast("Registro eliminado.");  
}  
 
function openPage(id) {  
    const item = items.find(x => x.id === id);  
    if (item && item.url) window.open(item.url, "_blank");  
}  
 
function updateStats() {  
    const pcElem = document.getElementById("pcCount");
    const androidElem = document.getElementById("androidCount");
    const pageElem = document.getElementById("pageCount");

    if (pcElem) pcElem.textContent = items.filter(x => x.type === "pc").length;  
    if (androidElem) androidElem.textContent = items.filter(x => x.type === "android").length;  
    if (pageElem) pageElem.textContent = items.filter(x => x.type === "page").length;  
}  
 
fileInput.addEventListener('change', () => {  
    if (fileInput.files.length > 0) {  
        selectedFile = fileInput.files[0];  
        showSelectedFile();  
    }  
});  

function closeModal(id) {  
    document.getElementById(id).classList.remove("show");  
    editingId = null;  
    selectedFile = null;  
}  

function openMobileMenu() {
    document.getElementById("mobileDrawer").classList.add("open");
    document.getElementById("drawerOverlay").classList.add("show");
    document.body.style.overflow = "hidden";
}

function closeMobileMenu() {
    document.getElementById("mobileDrawer").classList.remove("open");
    document.getElementById("drawerOverlay").classList.remove("show");
    document.body.style.overflow = "";
}

function openSettings() {
    document.getElementById("settingsModal").classList.add("show");
}

function openPasswordModal() {
    closeModal("settingsModal");
    document.getElementById("passwordModal").classList.add("show");
}

function savePassword() {
    const current = document.getElementById("currentPassword").value.trim();
    const next = document.getElementById("newPassword").value.trim();

    if (!current || !next) {
        toast("Completa ambos campos de contraseña.");
        return;
    }

    document.getElementById("currentPassword").value = "";
    document.getElementById("newPassword").value = "";
    closeModal("passwordModal");
    toast("Contraseña actualizada correctamente.");
}

const FULLSCREEN_ICON_ENTER = `<svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>`;
const FULLSCREEN_ICON_EXIT = `<svg viewBox="0 0 24 24"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>`;

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else if (document.exitFullscreen) {
        document.exitFullscreen();
    }
}

function updateFullscreenIcon() {
    const btn = document.getElementById("fullscreenBtn");
    if (!btn) return;
    const isFullscreen = !!document.fullscreenElement;
    btn.innerHTML = isFullscreen ? FULLSCREEN_ICON_EXIT : FULLSCREEN_ICON_ENTER;
    btn.title = isFullscreen ? "Salir de pantalla completa" : "Pantalla completa";
}

document.addEventListener("fullscreenchange", updateFullscreenIcon);

window.addEventListener("resize", () => {
    if (window.innerWidth > 1100) {
        closeMobileMenu();
    }
});
 
function toggleTheme() {  
    const dark = document.body.dataset.theme === "dark";  
    const btn = document.getElementById("themeButton");  
    if (dark) {  
        delete document.body.dataset.theme;  
        localStorage.setItem("cloudpanel-theme", "light");  
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;  
        btn.title = "Noche";  
    } else {  
        document.body.dataset.theme = "dark";  
        localStorage.setItem("cloudpanel-theme", "dark");  
        btn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;  
        btn.title = "Día";  
    }  
}  
 
if (localStorage.getItem("cloudpanel-theme") === "dark") {  
    document.body.dataset.theme = "dark";  
    const btn = document.getElementById("themeButton");  
    btn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;  
    btn.title = "Día";  
}  
 
function toast(message) {  
    const container = document.getElementById("toastContainer");  
    const element = document.createElement("div");  
    element.className = "toast";  
    element.textContent = message;  
    container.appendChild(element);  
    setTimeout(() => element.remove(), 3000);  
}  
 
function formatBytes(bytes) {  
    if (bytes === 0) return "0 Bytes";  
    const units = ["Bytes", "KB", "MB", "GB"];  
    const i = Math.floor(Math.log(bytes) / Math.log(1024));  
    return parseFloat((bytes / Math.pow(1024, i)).toFixed(1)) + " " + units[i];  
}  
 
function getToday() {  
    const d = new Date();  
    const months = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];  
    return d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();  
}  
 
function escapeHTML(value) {  
    return String(value).replace(/[&<>"']/g, c => ({  
        "&": "&amp;",  
        "<": "&lt;",  
        ">": "&gt;",  
        '"': "&quot;",  
        "'": "&#039;"  
    })[c]);  
}  

updateSectionClass();
 
updateActions();  
updateStats();  
renderTable();  
</script>
